# 05 · Awwwards-Grade Patterns

> The patterns that win awards aren't novel — they're committed. Pick a pattern,
> execute it with conviction, and the design reads as intentional. Each pattern
> below is lifted from the visual canon of awwwards.com Site of the Day winners
> and broken down into the moves that make it work.

---

## How to use this file

For any new page or section:

1. **Choose a pattern by intent** (§ table below).
2. **Read its breakdown**: anatomy, the ONE move that makes it great, dimensions.
3. **Copy the structure**, fill with real content, do not deviate without a reason.

| Goal | Pattern | Reference |
|---|---|---|
| Tech / dev tool landing | §1 The Centered Hero | agentic, expressive, deployer |
| Editorial / publication | §2 The Magazine Split | editorial, publication |
| Marketing landing | §3 The Asymmetric Hero | difuse, oneapp, lumina-finance |
| Dashboard / app | §4 The Dashboard Frame | typeui.sh, flowloop |
| Bold / brutalist | §5 The Oversized Type | brutalism, exhibit, refined |
| Bento / multi-tile | §6 The Bento Grid | bento, cosmic |
| Product / e-commerce | §7 The Product Showcase | lumi, snackmagic, ghia |
| Portfolio / agency | §8 The Featured Works | skyline, lumina-agency |
| Editorial dark hero | §9 The Restraint Hero | impeccable, retro |
| News / feed | §10 The Lopsided Feed | publication, lopsided |

---

## §1 · The Centered Hero

**Used by:** dev tools, AI products, SaaS launches.

```
                  [overline · v2.0 is live]

              THE #1 AI AGENT FOR
              ALL YOUR CODEBASE

         #1 IN BAKE-OFFS · #1 IN BENCHMARKS · #1 ON G2

              [Primary CTA]   [Secondary CTA]

                      ┌──────────────┐
                      │  product viz │
                      └──────────────┘
```

**Anatomy:**
- Overline pill (badge, optional)
- Display headline (step 7–8, **48–69px**, 2 lines max, weight 700, tracking -0.025em, lh 1.05)
- Inline credentials row (small caps, divided by `·`, color: muted)
- Two CTAs (primary + secondary, both 50px tall, horizontal gap 12px)
- Below-the-fold product visual (terminal screenshot, dashboard, or product mockup)

**The ONE move:** Headline is the entire visual hierarchy. Everything else is a supporting prop with less than 25% of the headline's visual weight.

**Dimensions:**
- Top padding: clamp(96px, 16vh, 192px)
- Vertical rhythm: overline → headline (gap 24), headline → credentials (gap 40), credentials → CTAs (gap 32)
- Container: `--ts-container-md` (960px max) — keeps the headline center-of-page
- Text alignment: center
- Background: `--ts-bg-body` with optional `--ts-accent-glow-bg` radial behind headline

**Snippet:**
```html
<section class="ts-hero ts-hero--centered ts-section--glow">
  <div class="ts-container ts-container--md">
    <p class="ts-badge">v2.0 is live</p>
    <h1 class="ts-hero__title">The #1 AI agent for<br>all your codebase</h1>
    <p class="ts-hero__credits">#1 in bake-offs · #1 in benchmarks · #1 on G2</p>
    <div class="ts-hero__actions">
      <a class="ts-btn ts-btn--primary ts-btn--lg">Start free trial</a>
      <a class="ts-btn ts-btn--ghost ts-btn--lg">View demo</a>
    </div>
  </div>
  <figure class="ts-hero__media">…</figure>
</section>
```

---

## §2 · The Magazine Split

**Used by:** editorial, long-form, publications.

```
┌────────────────────────┬───────────────────────────┐
│ DESIGN · 10 min read   │ EDITORIAL                  │
│                        │                            │
│ The radical return to  │ "When you remove           │
│ minimal interfaces.    │  everything that isn't     │
│                        │  essential, what remains   │
│ The industry is        │  must be perfect."         │
│ stripping away…        │                            │
│                        │ — Editor in Chief          │
│ [Read full story]      │                            │
└────────────────────────┴───────────────────────────┘
┌────────────┬────────────┬────────────┬────────────┐
│ TECHNOLOGY │ CULTURE    │ ARCHITECTURE│ DESIGN    │
│ Death of   │ Working in │ Building   │ More      │
│ the…       │ the age…   │ for the…   │ stories…  │
└────────────┴────────────┴────────────┴────────────┘
```

**Anatomy:**
- Hero split (2:3 or 5:7 — see Layout §4.2). Left: article preview. Right: pull quote on `--ts-bg-3`.
- Below: 4-column equal grid of secondary stories. Each: overline + headline + 2 lines of body.
- Vertical dividers between columns (1px `--ts-border-1`).

**The ONE move:** No imagery in the hero. Pure typography carries 100% of the visual weight.

**Dimensions:**
- Headlines in hero: step 5 (40px), display font, weight 600
- Pull quote: step 4 (33px), display font (often serif), weight 500
- Cell body: step 0 (16px), 2-line clamp, color `--ts-text-secondary`
- Cell padding: sp-6 (24px)
- Divider: 1px between columns ONLY, no horizontal dividers

---

## §3 · The Asymmetric Hero

**Used by:** marketing landings, product launches.

```
┌──────────────────────────────────────┐  ┌──────────────┐
│ COMPACT                              │  │              │
│ POWERFUL    Rebuilding the           │  │  product 3D  │
│ SEAMLESS    Network Stack.           │  │  illustration│
│                                      │  │              │
│ We build intelligent router platforms│  │  ┌────────┐ │
│ that unify networking and…           │  │  │ floating│ │
│                                      │  │  │  badge  │ │
│ [Online store]  [Become a partner →] │  │  └────────┘ │
└──────────────────────────────────────┘  └──────────────┘
```

**Anatomy:**
- Left column (5fr): vertical-stacked kicker labels (UPPERCASE, weight 500, color muted), headline, body, CTA pair.
- Right column (7fr): product visualization (illustration, photo, 3D render) with floating decorative badges.

**The ONE move:** The kicker labels stack vertically on the LEFT of the headline like a magazine table of contents. This is unusual and instantly readable as "designed."

**Dimensions:**
- Kicker labels: step -2 (11px), weight 500, UPPERCASE, tracking +0.08em, vertical gap sp-2, color `--ts-text-muted`
- Headline: step 6 (48px), display, weight 700, tracking -0.025em, lh 1.05
- Container ratio 5:7 OR 6:6 with kickers absolutely positioned in the left gutter

---

## §4 · The Dashboard Frame

**Used by:** SaaS apps, admin panels, IDEs.

```
┌──┬───────────────────────────────────────────────────────┐
│  │  ┌─ Search ──────────────┐         + New Project [▾] │
│  │  └───────────────────────┘                            │
│N │  ┌────────┐ ┌────────┐ ┌────────┐ ┌────────┐         │
│A │  │ Stat 1 │ │ Stat 2 │ │ Stat 3 │ │ Stat 4 │         │
│V │  └────────┘ └────────┘ └────────┘ └────────┘         │
│  │  ┌──────────────────────┐ ┌───────────────────────┐   │
│  │  │   Chart card         │ │   Activity card        │   │
│  │  │                       │ │                        │   │
│  │  └──────────────────────┘ └───────────────────────┘   │
└──┴───────────────────────────────────────────────────────┘
```

**Anatomy:**
- Left sidenav (240px), bg-1, vertical icon+label nav
- Topbar (56px), bg-0, search + actions
- Content area: bento grid of stat cards on top row + 2-column chart/activity below
- Generous gutters (sp-6 between cards)

**The ONE move:** Stat cards use **tabular numerals** (`font-feature-settings: "tnum"`).
This single CSS rule is what separates pro dashboards from amateur ones.

**Dimensions:**
- Stat metric: step 5 (40px), weight 700, tnum
- Stat card padding: sp-6 (24px)
- Stat card gap (in grid): sp-6
- Chart card padding: sp-6, min-height 320px
- Sidenav item: 40px tall, sp-3 padding-inline, sp-2 gap to icon

→ Full markup in `references/03-layout-and-spacing.md` §5.3.

---

## §5 · The Oversized Type Hero

**Used by:** brutalism, editorial-poster, statement landings.

```
┌────────────────────────────────────────────────────┐
│                                                     │
│  NO                                                 │
│  EXCUSES                                            │
│  ONLY                                               │
│  RESULTS                                            │
│                                                     │
│                                       BUILDING ABSOLUTE
│                                       STRENGTH & ENDURANCE │
└────────────────────────────────────────────────────┘
```

**Anatomy:**
- Single dominant block of stacked UPPERCASE words. Each on its own line.
- Color contrast within the stack (1–2 words in accent, rest in primary).
- Tiny supporting label in the opposite corner of the negative space.

**The ONE move:** Type fills 60%+ of the viewport width. Letters touch the safe-area edges (1–2vw margin). This is intentional, not careless.

**Dimensions:**
- Font size: `clamp(80px, 18vw, 280px)` — ultra-display
- Font weight: 800–900 (Bricolage Grotesque, Druk, or similar)
- Line-height: 0.85 (yes, that tight)
- Letter-spacing: -0.04em
- Tracking variation by line is OK (line 1 -0.04, line 2 -0.05) for poster feel
- Background: solid `--ts-bg-body`; accent words use `--ts-accent`
- Text alignment: left (right or center is too magazine-y)

**WCAG note:** at 18vw the type is huge — `text-wrap: balance` and reduced-motion fades are friend not foe.

---

## §6 · The Bento Grid

**Used by:** product landings, "everything we do" sections.

```
┌──────────────────┬──────────────┐
│                  │              │
│    HERO TILE     │  TALL TILE   │
│      8×2         │     4×2      │
│                  │              │
├────────┬─────────┴──────┬───────┤
│ TILE   │      TILE      │  T    │
│ 3×1    │      5×1       │  3×1  │
└────────┴────────────────┴───────┘
```

**Anatomy:**
- 12-column grid, dense packing (`grid-auto-flow: dense`)
- Tiles span varied columns and rows (8×2, 4×2, 6×1, 3×1, etc.)
- ONE tile dominates (the hero, 8×2 or 12×1)
- Each tile is self-contained: title + visual element OR title + body

**The ONE move:** The hero tile is **at least 2× the area** of any other tile. Without a clear hero, the bento reads as a collage instead of a hierarchy.

**Dimensions:**
- Grid gap: sp-6 (24px)
- Grid-auto-rows: minmax(180px, auto)
- Tile padding: sp-6 (small/medium tiles) or sp-8 (hero tile)
- Tile background: varies per tile (bg-1, bg-2, accent surface) but always 2-3 distinct values
- Tile radius: `--ts-radius-md` consistently across all tiles
- Hero tile content: `align-content: end` for headline-bottom-left layout

→ Full markup in `references/03-layout-and-spacing.md` §5.2.

---

## §7 · The Product Showcase

**Used by:** e-commerce, beverage/food, fashion.

```
┌──────────────────────────────────────────────┐
│  NEW FLAVORS ARRIVED                          │
│                                               │
│  THE POWER             ┌──────────────────┐  │
│  OF BITES              │                  │  │
│                        │   product photo  │  │
│  Dive into our…        │   (rotated 6deg) │  │
│                        │                  │  │
│  [Shop Now] [View menu]│  ┌──[badge]──┐   │  │
│                        │  └──────────┘    │  │
│                        └──────────────────┘  │
└──────────────────────────────────────────────┘
```

**Anatomy:**
- Split: text left (5fr), product image right (7fr) — or reverse
- Product image is **rotated** slightly (3–6deg) for energy
- 1–2 floating badges (decorative, sticker-style) on top of the image

**The ONE move:** The rotation. A perfectly straight product photo on a landing looks like a catalog. 4 degrees of tilt + a soft shadow = "lifestyle."

**Dimensions:**
- Image rotation: rotate(-4deg) or rotate(6deg)
- Image shadow: large blurred shadow that doesn't rotate (`filter: drop-shadow(0 24px 48px rgba(0,0,0,0.2))`)
- Badge: position absolute, slight rotate(-12deg), padding sp-2 sp-3, bg accent or contrast, radius full
- Background: subtle accent-tinted (`background: color-mix(in srgb, var(--ts-accent), white 92%)`)

---

## §8 · The Featured Works Grid

**Used by:** agencies, portfolios, case-study indices.

```
┌──────────────────────────────────────────────────┐
│ FEATURED                We build beautiful and   │
│ WORKS                   functional websites…     │
│                                                   │
│                         [Explore works →]         │
├──────────────┬───────────────┬────────────────────┤
│              │               │                    │
│   Project    │   Project     │   Project          │
│   thumb 1    │   thumb 2     │   thumb 3          │
│              │               │                    │
│   OLDTECH    │   CREATIFY    │   MARQUIX          │
│   Tech       │   Design      │   New Tech         │
└──────────────┴───────────────┴────────────────────┘
```

**Anatomy:**
- Header: ultra-display title left (step 8), short description + CTA right (5:7 ratio)
- 3-column gallery below: each tile is a media card with hover scale + corner label

**The ONE move:** The header title is **vertically baseline-aligned with the description's first line** — so the giant title and the small description start at the same x-height. This requires negative margin on the title.

**Dimensions:**
- Title: step 8 (69px) or larger via `clamp(48px, 8vw, 96px)`
- Description: step 0 (16px), max-width 36ch
- Tile aspect-ratio: 4/3 or 1/1
- Tile hover: `transform: translateY(-4px); box-shadow: shadow-3`

---

## §9 · The Restraint Hero (premium / luxury)

**Used by:** luxury brands, premium SaaS, editorial newsletters.

```
┌────────────────────────────────────────────────────┐
│                                                     │
│                                                     │
│                                                     │
│                                                     │
│           Tell your story with warmth               │
│                  and clarity.                        │
│                                                     │
│        An editorial platform designed for long-     │
│        form reading and thoughtful writing.         │
│                                                     │
│              [Start your journal]  [Read manifesto] │
│                                                     │
│                                                     │
│                                                     │
└────────────────────────────────────────────────────┘
```

**Anatomy:**
- 80%+ whitespace. Content occupies the middle 40% vertically.
- Headline uses a **serif** display (Instrument Serif, Fraunces) with **italic** for one word
- Body: humble, sans-serif, weight 400, color `--ts-text-secondary`
- CTAs: black/inverted primary + outline secondary

**The ONE move:** The italic word in the headline (`Tell your story with *warmth*`). A single italic in serif = "we have taste." Don't overdo it; one italic per page.

**Dimensions:**
- Headline: step 6-7 (48–57px), serif, weight 500 (NOT 700 — restraint)
- Body max-width: 50ch, centered
- Background: light preset (light-warm-paper-v2 is the gold standard here)
- Vertical centering: `min-height: 80vh; align-content: center`

---

## §10 · The Lopsided News Feed

**Used by:** news, content aggregators, feed-based products.

```
┌─────────────────────────────────────────────────────────┐
│ Home | My Feed ▾ | Lopsided | Local News               │
├─────────────────────────────────────────────────────────┤
│  Lopsided   Stories disproportionately reported…        │
├────────────────────────────────┬────────────────────────┤
│ ┌──────────┐  ┌──────────┐    │  ┌──────────────────┐ │
│ │ tile 1   │  │ tile 2   │    │  │ Daily Index       │ │
│ │ [|||]    │  │ [|||]    │    │  │ 124 LEFT 112 RIGHT│ │
│ └──────────┘  └──────────┘    │  │                   │ │
│ ┌──────────┐  ┌──────────┐    │  │ AI Summary panel  │ │
│ │ tile 3   │  │ tile 4   │    │  │ ─────             │ │
│ │ [|||]    │  │ [|||]    │    │  │                   │ │
│ └──────────┘  └──────────┘    │  └──────────────────┘ │
└────────────────────────────────┴────────────────────────┘
```

**Anatomy:**
- 12-column grid: 9 cols for main feed, 3 cols for sticky sidebar
- Feed: 2-column tiles with colored bias bars (visual data primitive)
- Sidebar: vertical stack of summary cards, sticky positioning

**The ONE move:** The bias bars (small horizontal segmented bars under each story). They're a data primitive that becomes the brand signature. Find one such primitive per product and use it everywhere.

**Dimensions:**
- Feed gap: sp-4 (16px) — denser than marketing
- Tile padding: sp-4
- Bias bar height: 6px, full-width below the image, segmented
- Sidebar width: 320–360px, sticky with `top: 80px`

---

## Cross-cutting moves (work on any pattern)

These additions elevate any of the 10 patterns above:

### A. The accent glow
```css
.ts-section--glow {
  position: relative;
  isolation: isolate;
}
.ts-section--glow::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  background: radial-gradient(
    ellipse 60% 50% at 50% 0%,
    color-mix(in srgb, var(--ts-accent), transparent 80%) 0%,
    transparent 70%
  );
  pointer-events: none;
}
```

### B. The grain texture
```css
.ts-grain {
  position: relative;
}
.ts-grain::before {
  content: '';
  position: absolute; inset: 0;
  background-image: var(--ts-grain);     /* SVG noise data URI */
  background-size: 200px;
  opacity: 0.5;
  mix-blend-mode: soft-light;
  pointer-events: none;
}
```

### C. Staggered reveal on load
```css
.ts-reveal { opacity: 0; transform: translateY(8px); }
.ts-reveal.is-in {
  opacity: 1; transform: none;
  transition: opacity 600ms var(--ts-ease-out), transform 600ms var(--ts-ease-out);
  transition-delay: calc(var(--i, 0) * 80ms);
}
```

```html
<h1 class="ts-reveal" style="--i: 0">…</h1>
<p  class="ts-reveal" style="--i: 1">…</p>
<div class="ts-reveal" style="--i: 2">…</div>
```

### D. The custom cursor (use SPARINGLY)
```css
@media (pointer: fine) {
  body { cursor: none; }
  .ts-cursor {
    position: fixed; pointer-events: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--ts-accent);
    transform: translate(-50%, -50%);
    mix-blend-mode: difference;
    transition: transform 100ms var(--ts-ease-out);
  }
}
```

JS: track pointer → translate `.ts-cursor`. Scale up on interactive hover.

---

## The award-grade checklist

For any pattern above, before declaring it ready:

- [ ] **One dominant element** holds 50%+ of the visual weight.
- [ ] **White space** is intentional — at least one large empty region.
- [ ] **Typography hierarchy** uses ≥ 3 step gap between primary and secondary text.
- [ ] **Color** uses accent + 1 neutral scale. No third color unless triadic system.
- [ ] **One micro-detail** (grain, glow, cursor, reveal) — not all four.
- [ ] **Imagery** is full-quality or doesn't exist. No tiny stock photos.
- [ ] **Motion** orchestrated as one event (page load), not scattered micro-interactions.
- [ ] **APCA contrast** passes (run generator).
- [ ] **Reduced motion** alternative works.
- [ ] **Mobile** is not an afterthought — re-walk all checks at 360px width.

10/10 = ship. 8/10 = iterate. < 8 = pattern was wrong choice, restart.

# 06 · Component Recipes — Buttons, Inputs, Badges, Forms, Nav

> Atomic components, copy-paste, locked. Every measurement comes from a token.
> Every state is defined. Use exactly as written.

## 1 · Buttons (`.ts-btn`)

The most-used component. Get this right and the system feels professional.

### 1.1 Base

```css
.ts-btn {
  /* sizing */
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ts-sp-2);
  height: var(--ts-btn-h, 44px);
  padding: 0 var(--ts-btn-pad-x, var(--ts-sp-5));
  /* type */
  font-family: inherit;
  font-size: var(--ts-btn-fs, var(--ts-fs-caption));
  font-weight: var(--ts-btn-fw, 600);
  letter-spacing: 0.02em;
  line-height: 1;
  /* shape */
  border-radius: var(--ts-btn-radius, var(--ts-radius-sm));
  border: 1px solid transparent;
  /* color (default = ghost) */
  background: transparent;
  color: var(--ts-text-primary);
  /* behavior */
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: background var(--ts-dur-fast) var(--ts-ease-out),
              border-color var(--ts-dur-fast) var(--ts-ease-out),
              color var(--ts-dur-fast) var(--ts-ease-out),
              transform var(--ts-dur-fast) var(--ts-ease-out);
}
.ts-btn:focus-visible {
  outline: 2px solid var(--ts-accent);
  outline-offset: 2px;
}
.ts-btn:disabled, .ts-btn[aria-disabled="true"] {
  opacity: 0.5; pointer-events: none;
}
.ts-btn:active { transform: translateY(1px); }
```

### 1.2 Variants

```css
.ts-btn--primary {
  background: var(--ts-accent);
  color: var(--ts-on-accent);
  border-color: var(--ts-accent);
}
.ts-btn--primary:hover {
  background: var(--ts-accent-bright);
  border-color: var(--ts-accent-bright);
}

.ts-btn--outline {
  background: transparent;
  color: var(--ts-text-primary);
  border-color: var(--ts-border-2);
}
.ts-btn--outline:hover {
  background: var(--ts-bg-2);
  border-color: var(--ts-text-primary);
}

.ts-btn--ghost {
  background: transparent;
  color: var(--ts-text-primary);
}
.ts-btn--ghost:hover { background: var(--ts-bg-2); }

.ts-btn--danger  { background: var(--ts-danger);  color: #fff; border-color: var(--ts-danger); }
.ts-btn--success { background: var(--ts-success); color: #fff; border-color: var(--ts-success); }
```

### 1.3 Sizes

```css
.ts-btn--sm { --ts-btn-h: 36px; --ts-btn-pad-x: var(--ts-sp-3); --ts-btn-fs: var(--ts-fs-caption); }
.ts-btn     { /* 44px default = WCAG touch */ }
.ts-btn--lg { --ts-btn-h: 50px; --ts-btn-pad-x: var(--ts-sp-6); --ts-btn-fs: var(--ts-fs-body); }
.ts-btn--xl { --ts-btn-h: 60px; --ts-btn-pad-x: var(--ts-sp-8); --ts-btn-fs: var(--ts-fs-lead); }
```

### 1.4 Modifiers

```css
.ts-btn--full { width: 100%; }
.ts-btn--icon { /* square */ width: var(--ts-btn-h, 44px); padding: 0; }
.ts-btn--pill { border-radius: var(--ts-radius-full); padding-inline: var(--ts-sp-6); }
```

### 1.5 Pitfalls

- ❌ Button text < 13px — fails readability. Stay step -1 minimum.
- ❌ Hover changes BOTH bg and border with different colors — choppy. Change in unison.
- ❌ `:hover` only, no `:focus-visible` — keyboard users can't see focus. Both mandatory.
- ❌ Loading spinner replacing text — width jumps. Lock the width via `min-width` or use a spinner overlay.

---

## 2 · Inputs (`.ts-input`)

### 2.1 Base

```css
.ts-input {
  width: 100%;
  height: 50px;
  padding: 0 var(--ts-sp-4);
  font: inherit;
  font-size: var(--ts-fs-body);
  color: var(--ts-text-primary);
  background: var(--ts-input-bg, var(--ts-bg-3));
  border: 1px solid var(--ts-input-border, var(--ts-border-1));
  border-radius: var(--ts-radius-sm);
  transition: border-color var(--ts-dur-fast) var(--ts-ease-out),
              background var(--ts-dur-fast) var(--ts-ease-out);
}
.ts-input::placeholder { color: var(--ts-text-muted); }
.ts-input:hover { border-color: var(--ts-border-2); }
.ts-input:focus-visible,
.ts-input:focus {
  outline: none;
  border-color: var(--ts-accent);
  background: var(--ts-bg-2);
  box-shadow: 0 0 0 3px var(--ts-accent-dim-2);
}
.ts-input:disabled { opacity: 0.5; cursor: not-allowed; }
.ts-input[aria-invalid="true"] {
  border-color: var(--ts-danger);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ts-danger), transparent 88%);
}
```

### 2.2 Field wrapper

```html
<div class="ts-field">
  <label class="ts-field__label" for="email">Email</label>
  <input class="ts-input" type="email" id="email" placeholder="you@company.com">
  <p class="ts-field__hint">We'll send a confirmation link.</p>
  <p class="ts-field__error" role="alert">Please enter a valid email.</p>
</div>
```

```css
.ts-field { display: grid; gap: var(--ts-sp-2); }
.ts-field__label { font-size: var(--ts-fs-caption); font-weight: 500; }
.ts-field__hint  { font-size: var(--ts-fs-caption); color: var(--ts-text-muted); }
.ts-field__error { font-size: var(--ts-fs-caption); color: var(--ts-danger); display: none; }
.ts-field[data-invalid="true"] .ts-field__error { display: block; }
.ts-field[data-invalid="true"] .ts-field__hint  { display: none; }
```

### 2.3 Pitfalls

- ❌ Label inside input as placeholder only — fails accessibility (lost on focus).
- ❌ Error icon without `aria-describedby` link — screen readers miss the error.
- ❌ Focus ring < 3px — invisible. Use the 3px accent-dim ring above.

---

## 3 · Select / Combobox (`.ts-select`)

Native select styled to match `.ts-input`:

```css
.ts-select {
  /* inherit ts-input styles */
  appearance: none;
  -webkit-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, currentColor 50%),
    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position:
    calc(100% - 18px) 22px,
    calc(100% - 13px) 22px;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: var(--ts-sp-8);
  cursor: pointer;
}
```

For complex combobox (searchable, multi-select): use Listbox/Combobox ARIA pattern.
Toolskin does not include a combobox component by default — use a vetted library
(e.g. Downshift, Radix Combobox) and re-skin with the `.ts-input` token surface.

## 4 · Badges (`.ts-badge`)

```css
.ts-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--ts-sp-1);
  height: 22px;
  padding: 0 var(--ts-sp-2);
  font-size: var(--ts-fs-micro);     /* 11px */
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  line-height: 1;
  border-radius: var(--ts-radius-full);
  background: var(--ts-bg-3);
  color: var(--ts-text-primary);
  border: 1px solid var(--ts-border-1);
}
.ts-badge--accent  { background: var(--ts-accent-dim); color: var(--ts-accent); border-color: var(--ts-accent-border); }
.ts-badge--success { background: color-mix(in srgb, var(--ts-success), transparent 85%); color: var(--ts-success); border-color: color-mix(in srgb, var(--ts-success), transparent 60%); }
.ts-badge--warning { background: color-mix(in srgb, var(--ts-warning), transparent 85%); color: var(--ts-warning); border-color: color-mix(in srgb, var(--ts-warning), transparent 60%); }
.ts-badge--danger  { background: color-mix(in srgb, var(--ts-danger),  transparent 85%); color: var(--ts-danger);  border-color: color-mix(in srgb, var(--ts-danger),  transparent 60%); }

.ts-badge--solid   { background: var(--ts-accent); color: var(--ts-on-accent); border-color: transparent; }

.ts-badge--dot::before {
  content: ''; width: 6px; height: 6px;
  border-radius: 50%; background: currentColor;
  display: inline-block;
}
```

### Pitfalls

- ❌ Badge > 14px tall — looks like a button. Stay 22–24px.
- ❌ Lowercase badge text — overlines are UPPERCASE.

---

## 5 · Chips (`.ts-chip`)

Larger than a badge, smaller than a button. Interactive (filter, tag).

```css
.ts-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--ts-sp-2);
  height: 32px;
  padding: 0 var(--ts-sp-3);
  font-size: var(--ts-fs-caption);
  font-weight: 500;
  border-radius: var(--ts-radius-full);
  background: var(--ts-bg-2);
  color: var(--ts-text-primary);
  border: 1px solid var(--ts-border-1);
  cursor: pointer;
  transition: all var(--ts-dur-fast) var(--ts-ease-out);
}
.ts-chip:hover { background: var(--ts-bg-3); }
.ts-chip[aria-pressed="true"],
.ts-chip--active {
  background: var(--ts-accent);
  color: var(--ts-on-accent);
  border-color: var(--ts-accent);
}
```

## 6 · Top navigation (`.ts-nav`)

```html
<header class="ts-nav">
  <a class="ts-nav__brand" href="/">Brand</a>
  <nav class="ts-nav__items">
    <a class="ts-nav__link" href="#">Product</a>
    <a class="ts-nav__link" href="#">Solutions</a>
    <a class="ts-nav__link" href="#">Pricing</a>
    <a class="ts-nav__link" href="#">Docs</a>
  </nav>
  <div class="ts-nav__actions">
    <a class="ts-btn ts-btn--ghost ts-btn--sm">Sign in</a>
    <a class="ts-btn ts-btn--primary ts-btn--sm">Start free</a>
  </div>
</header>
```

```css
.ts-nav {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: var(--ts-sp-8);
  height: 64px;
  padding: 0 var(--ts-container-pad);
  background: color-mix(in srgb, var(--ts-bg-body), transparent 20%);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--ts-border-0);
  position: sticky;
  top: 0; z-index: 100;
}
.ts-nav__brand {
  font-weight: 700;
  font-size: var(--ts-fs-body);
  letter-spacing: var(--ts-tracking-tight);
}
.ts-nav__items {
  display: flex;
  gap: var(--ts-sp-6);
  justify-content: center;        /* nav links centered */
}
.ts-nav__link {
  font-size: var(--ts-fs-caption);
  color: var(--ts-text-secondary);
  text-decoration: none;
  padding: var(--ts-sp-2);
  border-radius: var(--ts-radius-sm);
}
.ts-nav__link:hover { color: var(--ts-text-primary); }
.ts-nav__link[aria-current="page"] { color: var(--ts-text-primary); font-weight: 600; }
.ts-nav__actions { display: flex; gap: var(--ts-sp-2); }

@media (max-width: 768px) {
  .ts-nav__items { display: none; }
  /* + hamburger toggle for drawer */
}
```

### Pitfalls

- ❌ Sticky nav without backdrop blur — looks like a banner. Always blur OR opaque bg.
- ❌ Nav height < 56px — touch targets cramped. 64px is the comfortable minimum.

---

## 7 · Footer (`.ts-footer`)

```css
.ts-footer {
  padding: var(--ts-sp-16) var(--ts-container-pad) var(--ts-sp-8);
  background: var(--ts-bg-1);
  border-top: 1px solid var(--ts-border-1);
}
.ts-footer__grid {
  max-width: var(--ts-container-lg);
  margin-inline: auto;
  display: grid;
  grid-template-columns: 2fr repeat(4, 1fr);
  gap: var(--ts-sp-8);
}
.ts-footer__brand { display: grid; gap: var(--ts-sp-3); max-width: 36ch; }
.ts-footer__col h4 {
  font-size: var(--ts-fs-caption);
  text-transform: uppercase;
  letter-spacing: var(--ts-tracking-wider);
  color: var(--ts-text-secondary);
  margin: 0 0 var(--ts-sp-4) 0;
  font-weight: 600;
}
.ts-footer__col ul { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--ts-sp-2); }
.ts-footer__col a {
  color: var(--ts-text-primary);
  text-decoration: none;
  font-size: var(--ts-fs-caption);
}
.ts-footer__col a:hover { color: var(--ts-accent); }

.ts-footer__bottom {
  max-width: var(--ts-container-lg);
  margin: var(--ts-sp-12) auto 0;
  padding-top: var(--ts-sp-6);
  border-top: 1px solid var(--ts-border-0);
  display: flex;
  justify-content: space-between;
  font-size: var(--ts-fs-caption);
  color: var(--ts-text-muted);
}

@media (max-width: 960px) {
  .ts-footer__grid { grid-template-columns: 1fr 1fr; }
  .ts-footer__brand { grid-column: 1 / -1; }
}
```

---

## 8 · Modal / Dialog (`.ts-modal`)

Use the native `<dialog>` element. It handles focus trap, ESC-close, backdrop click.

```css
.ts-modal {
  border: 1px solid var(--ts-border-1);
  background: var(--ts-bg-2);
  border-radius: var(--ts-radius-lg);
  padding: 0;
  width: min(92vw, 520px);
  max-height: 90dvh;
  box-shadow: var(--ts-shadow-4);
  color: var(--ts-text-primary);
}
.ts-modal::backdrop {
  background: color-mix(in srgb, var(--ts-bg-body), transparent 30%);
  backdrop-filter: blur(8px);
}
.ts-modal__header {
  padding: var(--ts-sp-6);
  border-bottom: 1px solid var(--ts-border-0);
  display: flex; align-items: center; justify-content: space-between;
}
.ts-modal__body { padding: var(--ts-sp-6); }
.ts-modal__footer {
  padding: var(--ts-sp-4) var(--ts-sp-6);
  border-top: 1px solid var(--ts-border-0);
  display: flex; gap: var(--ts-sp-3); justify-content: flex-end;
}
```

```js
modal.showModal();   // opens with backdrop, focus trap, ESC-close, all free
modal.close();
```

### Pitfalls
- ❌ Custom div modal without `<dialog>` — you re-implement focus trap badly. Use the platform.
- ❌ Modal width > 600px — feels invasive. Stay 480–560px for confirm/info modals; 720px max for forms.

- [ ] Border uses `currentColor`-based for dark/light reuse.

 * fails.
 *
 * Run:  node scripts/audit-design.mjs <path/to/file.html>
 *
 * Checks:
 *   HARD (exit 1 if any fail)
 *     - Hardcoded hex colors in CSS (must be var(--ts-*) or in :root)
 *     - !important declarations
 *     - 1fr grid columns without minmax(0, …) safety belt
 *     - Banned default fonts (Inter, Roboto, Arial, system-ui) as PRIMARY pick
 *     - vh on full-height containers (should be dvh)
 *     - position: fixed/absolute without z-index
 *
 *   SOFT (warning only)
 *     - Off-ladder font-size values (not on the 1.200 ladder)
 *     - Off-grid padding/margin values (not from --ts-sp-*)
 *     - Missing :focus-visible alongside :hover
 *     - More than 2 type families loaded
 *     - max-width > 80ch on prose

import path from 'node:path';

  console.error('usage: node audit-design.mjs <file.html>');

const soft = [];

function flag(level, rule, source, snippet, fix) {
  (level === 'hard' ? hard : soft).push({ rule, source, snippet: snippet.trim().slice(0, 120), fix });
}

// ── 1.200 ladder (reasonable px values) ──────────────────────────────────
const LADDER_PX = [11.11, 13.33, 16, 19.2, 23.04, 27.65, 33.18, 39.81, 47.78, 57.33, 68.8, 82.55];
function isOnLadder(px) {
  return LADDER_PX.some((v) => Math.abs(v - px) < 0.6);
}

// ── 8pt grid ─────────────────────────────────────────────────────────────
const SP = [0, 4, 8, 12, 16, 20, 24, 32, 40, 48, 64, 80, 96, 128];
function isOnGrid(px) { return SP.includes(Math.round(px)); }

// ── banned fonts as PRIMARY (still ok as fallback in stack) ──────────────
const BANNED_DEFAULTS = ['Inter', 'Roboto', 'Arial', 'system-ui', 'sans-serif', 'Helvetica'];

// ── scan each CSS chunk ──────────────────────────────────────────────────
for (const { source, css } of cssChunks) {
  // strip comments to avoid false positives
  const clean = css.replace(/\/\*[\s\S]*?\*\//g, '');

  // HARD: hardcoded hex outside :root or @theme
  // (allowed in :root { … } blocks; flagged anywhere else)
  const rootBlocks = [...clean.matchAll(/(:root\s*(?:\[[^\]]+\])?\s*\{[\s\S]*?\})/g)].map(m => m[0]).join('\n');
  const nonRoot = clean.replace(/(:root\s*(?:\[[^\]]+\])?\s*\{[\s\S]*?\})/g, '');
  const hexMatches = [...nonRoot.matchAll(/#[0-9a-f]{3,8}\b/gi)];
  for (const m of hexMatches) {
    // allow in url() and svg fills/strokes
    const idx = m.index;
    const around = nonRoot.slice(Math.max(0, idx - 20), idx + 20);
    if (/url\(|fill=|stroke=/i.test(around)) continue;
    flag('hard', 'hardcoded-hex', source, around, `Replace with var(--ts-*). Add the color to :root or use color-mix().`);
  }

  // HARD: !important
  const bangs = [...clean.matchAll(/!important\b/g)];
  for (const m of bangs) {
    const around = clean.slice(Math.max(0, m.index - 60), m.index + 20);
    flag('hard', 'no-important', source, around, `Fix specificity instead. Use @layer or rewrite the selector.`);
  }

  // HARD: 1fr without minmax(0, …) or minmax(min(100%, …), …)
  const gridCols = [...clean.matchAll(/grid-template-columns\s*:\s*([^;}\n]+)/g)];
  for (const m of gridCols) {
    const val = m[1];
    if (/\b1fr\b/.test(val) && !/minmax\s*\(/.test(val)) {
      flag('hard', 'unsafe-grid-1fr', source, m[0], `Use minmax(0, 1fr) or minmax(min(100%, 280px), 1fr).`);
    }
  }

  // HARD: vh on min-height: 100vh (use dvh)
  const vhMatches = [...clean.matchAll(/min-height\s*:\s*100\s*vh/gi)];
  for (const m of vhMatches) {
    flag('hard', 'use-dvh', source, m[0], `100vh breaks on mobile. Use 100dvh.`);
  }

  // SOFT: off-ladder font-size in px
  const fsMatches = [...clean.matchAll(/font-size\s*:\s*([\d.]+)px/g)];
  for (const m of fsMatches) {
    const px = parseFloat(m[1]);
    if (px > 10 && !isOnLadder(px)) {
      flag('soft', 'off-ladder-font-size', source, m[0], `Use --ts-fs-* tokens. Nearest ladder value: ${LADDER_PX.reduce((a, b) => Math.abs(b - px) < Math.abs(a - px) ? b : a)}px.`);
    }
  }

  // SOFT: off-grid padding/margin in px
  const spMatches = [...clean.matchAll(/(padding|margin|gap)\s*:\s*([^;}\n]+)/g)];
  for (const m of spMatches) {
    const vals = m[2].match(/[\d.]+px/g) || [];
    for (const v of vals) {
      const px = parseFloat(v);
      if (px > 0 && !isOnGrid(px)) {
        flag('soft', 'off-grid-spacing', source, m[0], `Use --ts-sp-* tokens. ${px}px is off-grid.`);
        break;       // one flag per declaration
      }
    }
  }

  // SOFT: :hover without :focus-visible nearby
  const selectors = [...clean.matchAll(/([.\-a-zA-Z0-9_]+):hover\s*\{/g)];
  for (const m of selectors) {
    const base = m[1];
    const hasFocus = new RegExp(`${base.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\<!-- FILE_BLOCKS_INJECTED_HERE -->')}:focus(?:-visible)?\\s*\\{`).test(clean);
    if (!hasFocus) {
      flag('soft', 'missing-focus-visible', source, `${base}:hover`, `Add ${base}:focus-visible with the same styling (or its own).`);
    }
  }

  // SOFT: too many font families loaded (count unique font-family in url())
  // (handled below via the HTML <link> scan)

  // HARD: banned default font as the FIRST item in font-family stack
  const fontFams = [...clean.matchAll(/font-family\s*:\s*([^;}\n]+)/g)];
  for (const m of fontFams) {
    const first = m[1].split(',')[0].trim().replace(/['"]/g, '');
    if (BANNED_DEFAULTS.includes(first)) {
      flag('hard', 'banned-default-font', source, m[0], `"${first}" is a fallback, not a primary choice. Open references/02-typography.md and pick a real font.`);
    }
  }
}

// ── HTML-level checks ────────────────────────────────────────────────────
// SOFT: more than 2 distinct font families requested from fonts.googleapis.com
const googleFontMatches = [...html.matchAll(/fonts\.googleapis\.com\/css2\?([^"']+)/g)];
const families = new Set();
for (const m of googleFontMatches) {
  const params = new URLSearchParams(m[1].replace(/&amp;/g, '&'));
  for (const f of params.getAll('family')) {
    families.add(f.split(':')[0]);
  }
}
if (families.size > 2) {
  flag('soft', 'too-many-fonts', 'HTML', `loaded: ${[...families].join(', ')}`, `Limit to 2 families max. Mono counts only when there's real code on screen.`);
}

// SOFT: missing <meta name="viewport">
if (!/<meta[^>]+name=["']viewport["']/i.test(html)) {
  flag('soft', 'missing-viewport', 'HTML', '<head>', `Add <meta name="viewport" content="width=device-width, initial-scale=1">.`);
}

// SOFT: missing prefers-reduced-motion handling
const cssAll = cssChunks.map(c => c.css).join('\n');
if (!/prefers-reduced-motion/.test(cssAll) && /animation\s*:|transition\s*:/.test(cssAll)) {
  flag('soft', 'no-reduced-motion', 'CSS', 'media queries', `Add @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }`);
}

// ── report ───────────────────────────────────────────────────────────────
const reset = '\x1b[0m', red = '\x1b[31m', yellow = '\x1b[33m', green = '\x1b[32m', dim = '\x1b[2m', bold = '\x1b[1m';

console.log(`\n${bold}── Toolskin design audit ──${reset}`);
console.log(`${dim}file:${reset} ${path.relative(process.cwd(), filePath)}`);
console.log(`${dim}css sources:${reset} ${cssChunks.map(c => c.source).join(', ') || '(none)'}\n`);

if (hard.length === 0 && soft.length === 0) {
  console.log(`${green}✓ no issues found. ship it.${reset}\n`);
  process.exit(0);
}

if (hard.length) {
  console.log(`${red}${bold}HARD failures (${hard.length}) — must fix:${reset}`);
  for (const f of hard) {
    console.log(`  ${red}✗${reset} ${bold}${f.rule}${reset}  ${dim}[${f.source}]${reset}`);
    console.log(`    ${dim}…${f.snippet}…${reset}`);
    console.log(`    ${green}→ ${f.fix}${reset}`);
  }
  console.log('');
}

if (soft.length) {
  console.log(`${yellow}${bold}SOFT warnings (${soft.length}) — fix if you can:${reset}`);
  for (const f of soft) {
    console.log(`  ${yellow}⚠${reset}  ${bold}${f.rule}${reset}  ${dim}[${f.source}]${reset}`);
    console.log(`    ${dim}…${f.snippet}…${reset}`);
    console.log(`    ${green}→ ${f.fix}${reset}`);
  }
  console.log('');
}

// score
const total = 100;
const hardPenalty = Math.min(60, hard.length * 12);
const softPenalty = Math.min(30, soft.length * 3);
const score = Math.max(0, total - hardPenalty - softPenalty);
const grade = score >= 95 ? 'A' : score >= 85 ? 'B' : score >= 70 ? 'C' : score >= 55 ? 'D' : 'F';
const colorFn = score >= 85 ? green : score >= 70 ? yellow : red;
console.log(`${bold}score:${reset} ${colorFn}${score}/100 (${grade})${reset}  ·  ${red}${hard.length} hard${reset} · ${yellow}${soft.length} soft${reset}\n`);

process.exit(hard.length > 0 ? 1 : 0);

</script>

#!/usr/bin/env bash
# Expert Designer Skill — Project Health Check v6
# Run: bash scripts/health-check.sh

set -u
PASS=0
FAIL=0
WARN=0

# colors
G='\033[32m'; R='\033[31m'; Y='\033[33m'; D='\033[2m'; B='\033[1m'; X='\033[0m'

check() {
  if eval "$2" &>/dev/null; then
    printf "  ${G}✓${X} %s\n" "$1"; PASS=$((PASS+1))
  else
    printf "  ${R}✗${X} %s\n" "$1"; FAIL=$((FAIL+1))
  fi
}

warn() {
  if eval "$2" &>/dev/null; then
    printf "  ${G}✓${X} %s\n" "$1"; PASS=$((PASS+1))
  else
    printf "  ${Y}⚠${X} %s ${D}(optional)${X}\n" "$1"; WARN=$((WARN+1))
  fi
}

printf "\n${B}── Expert Designer · Toolskin Health Check ──${X}\n\n"

# ── 1 · Skill files ──
printf "${B}1. Skill structure${X}\n"
check "expert-designer/SKILL.md exists"               "[ -f expert-designer/SKILL.md ]"
check "01-foundation reference"                       "[ -f expert-designer/references/01-foundation.md ]"
check "02-typography reference"                       "[ -f expert-designer/references/02-typography.md ]"
check "03-layout-and-spacing reference"               "[ -f expert-designer/references/03-layout-and-spacing.md ]"
check "04-cards-and-containers reference"             "[ -f expert-designer/references/04-cards-and-containers.md ]"
check "05-awwwards-patterns reference"                "[ -f expert-designer/references/05-awwwards-patterns.md ]"
check "06-component-recipes reference"                "[ -f expert-designer/references/06-component-recipes.md ]"
printf "\n"

# ── 2 · Scripts ──
printf "${B}2. Scripts${X}\n"
check "generate-colors.js exists"                     "[ -f expert-designer/scripts/generate-colors.js ]"
check "audit-design.mjs exists"                       "[ -f expert-designer/scripts/audit-design.mjs ]"
check "health-check.sh exists"                        "[ -f expert-designer/scripts/health-check.sh ]"
check "scaffold-component.sh exists"                  "[ -f expert-designer/scripts/scaffold-component.sh ]"
printf "\n"

# ── 3 · Templates ──
printf "${B}3. Templates${X}\n"
check "seed-page.html exists"                         "[ -f expert-designer/templates/seed-page.html ]"
check "tokens.css exists"                             "[ -f expert-designer/templates/tokens.css ]"
warn "showcase.html exists"                           "[ -f expert-designer/showcase.html ]"
printf "\n"

# ── 4 · Color engine ──
printf "${B}4. Color engine${X}\n"
if command -v node &>/dev/null; then
  if [ -f expert-designer/scripts/generate-colors.js ]; then
    # Try running the generator (require node modules — may not be installed in this scaffold)
    if (cd expert-designer && node scripts/generate-colors.js 2>/dev/null); then
      printf "  ${G}✓${X} generate-colors.js runs and APCA passes\n"; PASS=$((PASS+1))
    else
      printf "  ${Y}⚠${X} generate-colors.js needs node deps ${D}(npm install apcach culori)${X}\n"; WARN=$((WARN+1))
    fi
  fi
else
  printf "  ${Y}⚠${X} node not available — color generator can't run\n"; WARN=$((WARN+1))
fi
printf "\n"

# ── 5 · Guardrails in any CSS ──
printf "${B}5. Guardrail scan (any local CSS)${X}\n"
if ls expert-designer/**/*.css 2>/dev/null | head -1 >/dev/null; then
  if grep -rn "!important" expert-designer/**/*.css 2>/dev/null | head -1 >/dev/null; then
    printf "  ${R}✗${X} '!important' found in CSS:\n"; FAIL=$((FAIL+1))
    grep -rn "!important" expert-designer/**/*.css 2>/dev/null | head -5 | sed 's/^/      /'
  else
    printf "  ${G}✓${X} no !important declarations in skill CSS\n"; PASS=$((PASS+1))
  fi
else
  printf "  ${D}— no local CSS to scan${X}\n"
fi
printf "\n"

# ── summary ──
printf "${B}── Summary ──${X}\n"
printf "  ${G}%d passed${X}  ·  ${R}%d failed${X}  ·  ${Y}%d warnings${X}\n\n" "$PASS" "$FAIL" "$WARN"

if [ $FAIL -gt 0 ]; then
  printf "${R}${B}HALT.${X} Fix the failures above before designing.\n\n"
  exit 1
else
  printf "${G}${B}✓ skill is healthy.${X}\n\n"
  exit 0
fi

</script>

#!/usr/bin/env bash
# scaffold-component.sh — copy a recipe out of the skill into your project
# Usage: bash scripts/scaffold-component.sh <recipe-name>
#   where <recipe-name> is one of:
#     card-stat | card-feature | card-media | card-person | card-price
#     card-quote | card-action | card-list | card-spotlight | card-glass
#     btn | input | badge | chip | nav | footer | modal | toast
#     hero-centered | hero-asymmetric | hero-oversized | bento | dashboard
#

set -e

NAME="${1:-}"
if [ -z "$NAME" ]; then
  echo "usage: bash scaffold-component.sh <recipe-name>"
  echo ""
  echo "available recipes:"
  echo "  cards:      card-stat card-feature card-media card-person card-price"
  echo "              card-quote card-action card-list card-spotlight card-glass"
  echo "  components: btn input badge chip nav footer modal toast"
  echo "  patterns:   hero-centered hero-asymmetric hero-oversized bento dashboard"

  read -p "$OUT already exists — overwrite? [y/N] " ok

/* ============================================================================
 * tokens.css — Toolskin design tokens for expert-designer v6
 * ----------------------------------------------------------------------------
 * The complete --ts-* contract: color, type, space, shape, motion, layout.
 * Drop this in any HTML to get the full system. Surfaces ship dark + light
 * default; switch by setting [data-theme="light"] on <html>.
 *
 * For production, generate the color block via scripts/generate-colors.js
 * (it dual-emits hex + oklch and runs APCA verification).
 * ========================================================================== */

@layer reset, base, tokens, components, utilities;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { min-height: 100dvh; }
  img, svg, video, picture { display: block; max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4, h5, h6, p { margin: 0; }
  ul, ol { padding: 0; margin: 0; }
}

@layer tokens {
  :root {
    /* ── 1. COLOR · the three knobs ────────────────────────────────── */
    --ts-accent-h: 18;
    --ts-accent-s: 100%;
    --ts-accent-l: 52%;

    --ts-accent:        hsl(var(--ts-accent-h) var(--ts-accent-s) var(--ts-accent-l));
    --ts-accent-bright: color-mix(in srgb, var(--ts-accent), #fff 15%);
    --ts-accent-dark:   color-mix(in srgb, var(--ts-accent), #000 25%);
    --ts-accent-dim:    color-mix(in srgb, var(--ts-accent), transparent 82%);
    --ts-accent-dim-2:  color-mix(in srgb, var(--ts-accent), transparent 92%);
    --ts-accent-border: color-mix(in srgb, var(--ts-accent), transparent 60%);
    --ts-on-accent:     oklch(from var(--ts-accent) clamp(0, (0.75 - l) * 999, 1) 0 0);

    /* alt accent (optional) */
    --ts-alt-h: 195; --ts-alt-s: 100%; --ts-alt-l: 40%;
    --ts-alt: hsl(var(--ts-alt-h) var(--ts-alt-s) var(--ts-alt-l));
    --ts-alt-dim: color-mix(in srgb, var(--ts-alt), transparent 82%);

    /* status */
    --ts-success: hsl(142 76% 36%);
    --ts-warning: hsl(45  100% 50%);
    --ts-danger:  hsl(0   85% 55%);
    --ts-info:    hsl(210 90% 55%);

    /* ── 2. TYPE · 1.200 ladder + roles ────────────────────────────── */
    --ts-font-display: 'Space Grotesk', system-ui, sans-serif;
    --ts-font-body:    'Space Grotesk', system-ui, sans-serif;
    --ts-font-mono:    'JetBrains Mono', ui-monospace, monospace;

    --ts-fs-base: 16px;
    --ts-fs-ratio: 1.2;

    --ts-fs--2: calc(var(--ts-fs-base) / var(--ts-fs-ratio) / var(--ts-fs-ratio));  /* 11.11 */
    --ts-fs--1: calc(var(--ts-fs-base) / var(--ts-fs-ratio));                       /* 13.33 */

    });

    // Accent lab — live retheme via slider

    const light = document.getElementById('light');
    const hueVal   = document.getElementById('hue-val');
    const satVal   = document.getElementById('sat-val');
    const lightVal = document.getElementById('light-val');

    function applyAccent() {
      root.style.setProperty('--ts-accent-h', hue.value);

      root.style.setProperty('--ts-accent-l', light.value + '%');
      hueVal.textContent = hue.value;
      satVal.textContent = sat.value + '%';
      lightVal.textContent = light.value + '%';
    }
    [hue, sat, light].forEach(el => el.addEventListener('input', applyAccent));

    // Scroll reveal — bypass entirely under reduced-motion
    const reveals = document.querySelectorAll('.reveal');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducedMotion) {
      reveals.forEach(r => r.classList.add('is-in'));
    } else {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('is-in'); });
      }, { threshold: 0.12 });
      reveals.forEach(r => io.observe(r));
      // Initial paint above the fold
      requestAnimationFrame(() => reveals.forEach(r => r.classList.add('is-in')));
    }

<script>
const fileEls = [].slice.call(document.querySelectorAll('[data-pack-file]'));
const FILES = fileEls.map(function (el) {
  return {
    path: el.dataset.path,
    lang: el.dataset.lang,
    bytes: parseInt(el.dataset.bytes, 10),
    content: el.textContent.replace(/^\n/, '').replace(/\n$/, '').replace(/<\\\/script/gi, '</script')
  };
});

const DESC = {
  'expert-designer/SKILL.md':                              'Agent entry point. Task classifier, four locked systems (color, type, space, shape), decision trees, ten hard guardrails, six-step workflow.',
  'expert-designer/HANDOFF.md':                            'Integration handoff for Session 3.x agents. Alignment edits required (RULING 3, 5, 9), integration sequence, what the skill gives + does not cover.',
  'expert-designer/references/01-foundation.md':           'Color engine, three knobs (accent-h/s/l), ten surface presets, APCA gate, --ts-* namespace contract, WordPress/Enfold bridge.',
  'expert-designer/references/02-typography.md':           'The 1.200 modular ladder anchored at 16px. Line-heights and tracking per role. Heading/body/mono font picks. Hierarchy patterns.',
  'expert-designer/references/03-layout-and-spacing.md':   '8pt grid + 4pt sub-grid. Container budgets. Three layout primitives (auto-fit, split, pinned-footer). Container queries. The "this won\'t break" test.',
  'expert-designer/references/04-cards-and-containers.md': 'Ten copy-paste card recipes (stat, feature, media, person, price, quote, action, list, spotlight, glass). Anatomy, dimensions, states, pitfalls.',
  'expert-designer/references/05-awwwards-patterns.md':    'Ten hero/section patterns from Awwwards canon. Each broken down to the ONE move that makes it great.',
  'expert-designer/references/06-component-recipes.md':    'Buttons, inputs, badges, chips, nav, footer, modal, toast. Full CSS, all states defined, accessibility notes.',
  'expert-designer/scripts/generate-colors.js':            'Deterministic color primitive builder. Dual-emits hex+OKLCH, runs APCA verification.',
  'expert-designer/scripts/audit-design.mjs':              'HTML linter. Catches hardcoded hex, !important, unsafe 1fr grids, banned fonts, off-ladder sizes. Exits 1 on hard fail.',
  'expert-designer/scripts/health-check.sh':               'Skill structure verifier. Checks files, scripts, templates, color engine.',
  'expert-designer/scripts/scaffold-component.sh':         'Drops a working recipe HTML into the cwd, ready to iterate on.',
  'expert-designer/templates/tokens.css':                  'The complete --ts-* contract in cascade layers (reset / tokens / base / components / utilities).',
  'expert-designer/templates/seed-page.html':              'Clean Toolskin starter — hero + features grid + CTA card.',
  'expert-designer/showcase.html':                         'Visual proof. Live themeable hero, HSL accent sliders, type ladder, surface swatches, live card recipes.'
};

const GROUPS = [
  { title: 'Start here', test: function(p){return p.indexOf('SKILL.md')>=0 || p.indexOf('HANDOFF.md')>=0;}, blurb: 'Begin here. The SKILL.md defines the decision protocol; HANDOFF.md aligns it with active Toolskin Session 3.x rulings.' },
  { title: 'References', test: function(p){return p.indexOf('/references/')>=0;}, blurb: 'Six lookup references — each a decision tool, not an essay. Open at most two per task.' },
  { title: 'Scripts',    test: function(p){return p.indexOf('/scripts/')>=0;}, blurb: 'Executable tools. Generate colors, lint pages, verify health, scaffold components.' },
  { title: 'Templates',  test: function(p){return p.indexOf('/templates/')>=0;}, blurb: 'Drop-in starting points. tokens.css wires the whole system; seed-page is a clean shell.' },
  { title: 'Showcase',   test: function(p){return p.indexOf('showcase.html')>=0;}, blurb: 'The visual proof. Live themeable showcase demonstrating every system in the skill.' }
];

const state = { view: 'home', activePath: null };
const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');

function bytesLabel(n) { return n < 1024 ? n + ' B' : (n/1024).toFixed(1) + ' KB'; }
function escapeHtml(s) { return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

function renderSidebar(filterText) {
  filterText = (filterText || '').toLowerCase().trim();
  let html = '<nav><button class="nav-item' + (state.view === 'home' ? ' is-active' : '') + '" data-home>';
  html += '<span><strong>Overview</strong><span class="nav-item__path">All files &amp; quick links</span></span></button></nav>';
  sidebar.innerHTML = html;
  for (let g = 0; g < GROUPS.length; g++) {
    const grp = GROUPS[g];
    const items = FILES.filter(function(f){ return grp.test(f.path) && (!filterText || f.path.toLowerCase().indexOf(filterText) >= 0); });
    if (!items.length) continue;
    const h3 = document.createElement('h3'); h3.textContent = grp.title; sidebar.appendChild(h3);
    const nav = document.createElement('nav');
    for (let i = 0; i < items.length; i++) {
      const f = items[i];
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (state.view === 'file' && state.activePath === f.path ? ' is-active' : '');
      btn.dataset.path = f.path;
      const short = f.path.replace('expert-designer/', '').replace(/\.(md|html|css|mjs|sh|js)$/, '');
      btn.innerHTML = '<span>' + escapeHtml(short) + '<span class="nav-item__path">' + escapeHtml(f.path) + '</span></span><span class="nav-item__size">' + bytesLabel(f.bytes) + '</span>';
      nav.appendChild(btn);
    }
    sidebar.appendChild(nav);
  }
}

function renderHome() {
  state.view = 'home'; state.activePath = null;
  renderSidebar(document.getElementById('search').value);
  const totalBytes = FILES.reduce(function(a, f){ return a + f.bytes; }, 0);
  let html = '<div class="home">';
  html += '<section class="home-hero">';
  html += '<div class="meta">';
  html += '<span class="chip">v6.0.0</span>';
  html += '<span class="chip">' + FILES.length + ' files · ' + (totalBytes/1024).toFixed(1) + ' KB</span>';
  html += '<span class="chip">Toolskin-locked</span>';
  html += '<span class="chip">Awwwards-grade</span>';
  html += '</div>';
  html += '<h1>Stop <em>guessing.</em><br>Look it up.</h1>';
  html += '<p>Agent-facing decision protocol for any Toolskin visual output. Color from one knob. Type on a 1.200 ladder. Space on the 8pt grid. Ten card recipes that don\'t break.</p>';
  html += '<div class="home-actions">';
  html += '<button class="btn btn--primary btn--lg" data-open="expert-designer/SKILL.md">Open SKILL.md</button>';
  html += '<button class="btn btn--lg" id="open-showcase">↗ Open showcase</button>';
  html += '</div>';
  html += '</section>';
  for (let g = 0; g < GROUPS.length; g++) {
    const grp = GROUPS[g];
    const items = FILES.filter(function(f){ return grp.test(f.path); });
    if (!items.length) continue;
    const num = ('0' + (g + 1)).slice(-2);
    html += '<header class="section-h"><div><div class="num">/ ' + num + '</div><h2>' + grp.title + '</h2></div><p>' + grp.blurb + '</p></header>';
    html += '<div class="card-grid">';
    for (let i = 0; i < items.length; i++) {
      const f = items[i];
      const short = f.path.replace('expert-designer/', '').replace(/\.[^./]+$/, '');
      html += '<button class="file-card" data-open="' + escapeAttr(f.path) + '">';
      html += '<div class="file-card__lang">' + f.lang + ' · ' + bytesLabel(f.bytes) + '</div>';
      html += '<div><h3>' + escapeHtml(short) + '</h3><div class="file-card__path">' + escapeHtml(f.path) + '</div></div>';
      html += '<div class="file-card__desc">' + escapeHtml(DESC[f.path] || '') + '</div>';
      html += '</button>';
    }
    html += '</div>';
  }
  html += '</div>';
  main.innerHTML = html;
  main.scrollTop = 0;
}

function renderFile(path) {
  const f = FILES.filter(function(x){return x.path === path;})[0];
  if (!f) { renderHome(); return; }
  state.view = 'file'; state.activePath = path;
  renderSidebar(document.getElementById('search').value);

  let body = '';
  if (f.lang === 'markdown' && typeof marked !== 'undefined') {
    marked.setOptions({ gfm: true, breaks: false });
    body = '<div class="md">' + marked.parse(f.content) + '</div>';
  } else if (f.lang === 'html' && f.path.indexOf('showcase.html') >= 0) {
    // Inline any local CSS dependencies into the iframe srcdoc.
    // Relative paths can't resolve inside srcdoc (no base URL), so we splice
    // the actual CSS content in place of <link rel="stylesheet" href="...">.
    let inlined = f.content;
    const linkRe = /<link\s+rel=["']stylesheet["']\s+href=["']([^"']+)["'][^>]*>/gi;
    inlined = inlined.replace(linkRe, function (m, href) {
      if (/^https?:/.test(href)) return m;                 // CDN — keep as-is
      // resolve relative to the file's own folder
      const baseDir = f.path.replace(/[^/]+$/, '');         // e.g. ""
      const resolved = (baseDir + href).replace(/[^/]+\/\.\.\//g, '');
      const cssFile = FILES.filter(function (x) { return x.path === resolved; })[0];
      if (!cssFile) return m;                              // no local match — keep link
      return '<style data-inlined-from="' + resolved + '">' + cssFile.content + '</style>';
    });

    // Inject a small link-interceptor so anchor clicks don't try to navigate
    // anywhere (kept self-contained per user spec).
    const intercept = '<script>document.addEventListener("click",function(e){var a=e.target.closest("a");if(a&&a.getAttribute("href")&&!a.target){e.preventDefault();}},true);</scr' + 'ipt>';
    inlined = inlined.replace(/<\/body>/i, intercept + '</body>');

    const srcdoc = inlined.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    // sandbox="allow-scripts" — scripts run, but no top-nav, no popups, no
    // form submission, no same-origin escape. The preview is fully contained.
    body = '<div style="margin-bottom: 24px;"><iframe srcdoc="' + srcdoc + '" sandbox="allow-scripts" style="width: 100%; height: 80dvh; border: 1px solid var(--ts-border-1); border-radius: 10px; background: var(--ts-bg-1);"></iframe></div>';
    body += '<details><summary style="cursor: pointer; padding: 12px; background: var(--ts-bg-1); border-radius: 8px; font-size: 13px;">View source</summary>';
    body += '<div class="source-view" style="margin-top: 12px;"><pre><code class="language-html">' + escapeHtml(f.content) + '</code></pre></div></details>';
  } else {
    const langMap = { javascript: 'language-js', bash: 'language-bash', css: 'language-css', html: 'language-html' };
    const langClass = langMap[f.lang] || '';
    body = '<div class="source-view"><pre><code class="' + langClass + '">' + escapeHtml(f.content) + '</code></pre></div>';
  }

  const head = '<div class="viewer"><header class="file-header"><div><h1>' + escapeHtml(f.path.split('/').pop()) + '</h1><div class="file-path">' + escapeHtml(f.path) + ' · ' + bytesLabel(f.bytes) + ' · ' + f.lang + '</div></div><div class="file-actions"><button class="btn" data-copy="' + escapeAttr(f.path) + '">⧉ Copy</button><button class="btn btn--primary" data-download="' + escapeAttr(f.path) + '">↓ Download</button></div></header>';
  main.innerHTML = head + body + '</div>';
  if (typeof Prism !== 'undefined') Prism.highlightAll();
  main.scrollTop = 0;
}

function downloadFile(path) {
  const f = FILES.filter(function(x){return x.path === path;})[0];
  if (!f) return;
  const blob = new Blob([f.content], { type: 'text/plain;charset=utf-8' });
  saveAs(blob, f.path.split('/').pop());
  showToast('Downloaded ' + f.path.split('/').pop());
}

function downloadAll() {
  const zip = new JSZip();
  for (let i = 0; i < FILES.length; i++) {
    const f = FILES[i];
    zip.file(f.path, f.content);
  }
  const readme = '# Expert Designer · Toolskin v6 — Unified Pack\n\n' +
    FILES.length + ' files · ' + (FILES.reduce(function(a,f){return a+f.bytes;},0)/1024).toFixed(1) + ' KB\n\n' +
    '## Quick start\n\n' +
    '1. Drop `expert-designer/` into your project root.\n' +
    '2. Open `expert-designer/SKILL.md` — that\'s the entry point.\n' +
    '3. For Session 3.x integration, open `expert-designer/HANDOFF.md`.\n' +
    '4. Open `expert-designer/showcase.html` in a browser for the live demo.\n' +
    '5. Run `node expert-designer/scripts/audit-design.mjs <file.html>` to lint any page.\n\n' +
    '## File map\n' +
    FILES.map(function(f){ return '- `' + f.path + '` — ' + (DESC[f.path] || ''); }).join('\n') + '\n';
  zip.file('README.md', readme);
  zip.generateAsync({ type: 'blob' }).then(function(blob){
    saveAs(blob, 'expert-designer-v6-pack.zip');
    showToast('Pack downloaded · ' + FILES.length + ' files');
  });
}

function copyFile(path) {
  const f = FILES.filter(function(x){return x.path === path;})[0];
  if (!f) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(f.content).then(function(){ showToast('Copied to clipboard'); });
  }
}

const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('is-visible'); }, 2000);
}

document.addEventListener('click', function(e){
  const open = e.target.closest('[data-open], [data-path]');
  if (open) {
    const p = open.dataset.open || open.dataset.path;
    if (p) { renderFile(p); return; }
  }
  if (e.target.closest('[data-home]')) { renderHome(); return; }
  const dl = e.target.closest('[data-download]');
  if (dl) { downloadFile(dl.dataset.download); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { copyFile(cp.dataset.copy); return; }
  if (e.target.closest('#download-all')) { downloadAll(); return; }
  if (e.target.closest('#open-showcase')) { renderFile('expert-designer/showcase.html'); return; }
});

document.getElementById('search').addEventListener('input', function(e){
  renderSidebar(e.target.value);
});

const themeToggle = document.getElementById('theme-toggle');
themeToggle.addEventListener('click', function(){
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  themeToggle.textContent = next === 'light' ? '☀' : '☾';
});

renderHome();
</script>
