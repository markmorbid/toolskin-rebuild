:root {
  --ts-accent-h: 18; --ts-accent-s: 100%; --ts-accent-l: 52%;
  --ts-accent: hsl(var(--ts-accent-h) var(--ts-accent-s) var(--ts-accent-l));
  --ts-accent-bright: color-mix(in srgb, var(--ts-accent), #fff 15%);
  --ts-accent-dim: color-mix(in srgb, var(--ts-accent), transparent 82%);
  --ts-accent-dim-2: color-mix(in srgb, var(--ts-accent), transparent 92%);
  --ts-accent-border: color-mix(in srgb, var(--ts-accent), transparent 60%);
  --ts-on-accent: oklch(from var(--ts-accent) clamp(0, (0.75 - l) * 999, 1) 0 0);
  --ts-bg-body: #0c0d0f; --ts-bg-0: #111214; --ts-bg-1: #17181b;
  --ts-bg-2: #1f2024; --ts-bg-3: #28292e; --ts-bg-4: #323439;
  --ts-text-primary: #e8e9ea; --ts-text-secondary: #9ea0a5; --ts-text-muted: #6d6f74;
  --ts-border-0: color-mix(in srgb, currentColor, transparent 94%);
  --ts-border-1: color-mix(in srgb, currentColor, transparent 90%);
  --ts-border-2: color-mix(in srgb, currentColor, transparent 84%);
}
[data-theme="light"] {
  --ts-bg-body: #f7f8f9; --ts-bg-0: #fff; --ts-bg-1: #f4f5f6;
  --ts-bg-2: #ecedef; --ts-bg-3: #e1e3e6; --ts-bg-4: #d4d7db;
  --ts-text-primary: #0f1012; --ts-text-secondary: #404347; --ts-text-muted: #5f6266;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100dvh; }
body {
  font-family: 'Space Grotesk', system-ui, sans-serif;
  font-size: 16px; line-height: 1.5;
  color: var(--ts-text-primary);
  background: var(--ts-bg-body);
  -webkit-font-smoothing: antialiased;
}
code, pre { font-family: 'JetBrains Mono', ui-monospace, monospace; }

.app {
  display: grid;
  grid-template-columns: 320px 1fr;
  grid-template-rows: 64px minmax(0, 1fr);
  grid-template-areas: "topbar topbar" "sidebar main";
  min-height: 100dvh;
  height: 100dvh;
}
@supports not (height: 100dvh) {
  .app { min-height: 100vh; height: 100vh; }
}
.topbar {
  grid-area: topbar;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 24px;
  padding: 0 24px;
  background: color-mix(in srgb, var(--ts-bg-body), transparent 10%);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--ts-border-1);
  position: sticky; top: 0; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.015em; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 5px;
  background: var(--ts-accent);
  display: grid; place-items: center;
  color: var(--ts-on-accent);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700;
}
.brand-sub { font-size: 12px; color: var(--ts-text-secondary); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-left: 8px; }
.search {
  width: min(100%, 360px); height: 36px; padding: 0 12px;
  background: var(--ts-bg-2);
  border: 1px solid var(--ts-border-1);
  border-radius: 5px;
  color: var(--ts-text-primary);
  font: inherit; font-size: 13px;
  justify-self: center;
}
.search:focus-visible { outline: none; border-color: var(--ts-accent); box-shadow: 0 0 0 3px var(--ts-accent-dim-2); }
.actions { display: flex; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 16px;
  font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
  border-radius: 5px;
  background: transparent;
  color: var(--ts-text-primary);
  border: 1px solid var(--ts-border-1);
  cursor: pointer; white-space: nowrap;
  transition: all 120ms cubic-bezier(0.16,1,0.3,1);
  text-decoration: none;
}
.btn:hover { background: var(--ts-bg-2); border-color: var(--ts-border-2); }
.btn--primary { background: var(--ts-accent); color: var(--ts-on-accent); border-color: var(--ts-accent); }
.btn--primary:hover { background: var(--ts-accent-bright); border-color: var(--ts-accent-bright); }
.btn--icon { width: 36px; padding: 0; justify-content: center; }
.btn--lg { height: 50px; padding: 0 24px; font-size: 16px; }

.sidebar {

  border-right: 1px solid var(--ts-border-1);
  background: var(--ts-bg-0);
  padding: 16px 0;
}
.sidebar h3 {

  margin: 16px 16px 8px;
}
.sidebar nav { display: grid; gap: 2px; padding: 0 8px; }
.nav-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px; align-items: center;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--ts-text-secondary);
  background: transparent; border: none;
  border-radius: 5px;

}
.nav-item:hover { background: var(--ts-bg-2); color: var(--ts-text-primary); }
.nav-item.is-active { background: var(--ts-accent-dim); color: var(--ts-accent); font-weight: 600; }

.main { grid-area: main; overflow-y: auto; }
.viewer { padding: 32px; max-width: 1080px; margin: 0 auto; }

.file-header {

}

.file-header .file-path { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ts-text-muted); }
.file-actions { display: flex; gap: 8px; }

.md h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin: 32px 0 16px; text-wrap: balance; }

.md ul, .md ol { padding-left: 24px; }

.section-h { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 32px; align-items: end; margin: 48px 0 32px; padding-bottom: 16px; border-bottom: 1px solid var(--ts-border-1); }

## 3 · The four locked systems

These are not suggestions. They are the constants of every Toolskin output.

### 3.1 Color — `generate-colors.js` is the only source of truth

- **Surfaces & text:** never invent. Pull from one of 10 curated `TOOLSKIN_SURFACE_PRESETS`
  (5 dark + 5 light). Default pair: `dark-practical-neutral-v1` + `light-practical-clean-v1`.
- **Accent:** one HSL triple → everything derives. Change only `--ts-accent-h / -s / -l`.
- **On-accent ink:** computed by relative-color formula
  `oklch(from var(--ts-accent) clamp(0, (0.75 - l) * 999, 1) 0 0)`. Never hardcode white/black on accent.
- **APCA gate:** primary ≥ Lc 75, secondary ≥ Lc 45, muted ≥ Lc 25 on `--ts-bg-body`.
  Run `node scripts/generate-colors.js` — exit code 1 if any pair fails.
- **NEVER** write a hex value into a component. NEVER use a `--ts-bg-*` to color text.

Full color spec → **`references/01-foundation.md`**.

### 3.2 Type — the 1.200 modular ladder, anchored at 16px

```
--ts-fs-base : 16px       (1rem)
--ts-fs-ratio: 1.200      (minor third — the locked default)

step  size      role                    line-height  letter-spacing
 -2   11.11px   micro / overline         1.4          +0.08em
 -1   13.33px   small / caption          1.45         +0.02em
  0   16.00px   body                     1.5           0
  1   19.20px   lead / subtitle          1.45          0
  2   23.04px   h5                       1.35         -0.005em
  3   27.65px   h4                       1.3          -0.01em
  4   33.18px   h3                       1.25         -0.015em
  5   39.81px   h2                       1.2          -0.02em
  6   47.78px   h1                       1.15         -0.025em
  7   57.33px   display sm               1.1          -0.03em
  8   68.80px   display md               1.05         -0.035em
  9   82.55px   display lg / hero        1.0          -0.04em
```

**Fluid form (use for steps ≥ 4):**
```css
font-size: clamp(<min>, <min>px + (<max>-<min>) * ((100vw - 480px) / (1280 - 480)), <max>);
```
Or simpler: `clamp(<min>, calc(<min>px + 2vw), <max>)` for hero text.

**Pairing rule:** 1–2 families max. Heading from §2 of typography reference; body from §3.
Mono only when there is real code/numbers on screen. **NEVER** use Inter / Roboto / Arial as a default — pick from `font-catalog.md`.

Full type spec → **`references/02-typography.md`**.

### 3.3 Space — the 8pt grid + 4pt sub-grid

```
--ts-sp-base: 4px
--ts-sp-1  =  4px        ← hairline gap (badges, icon-text)
--ts-sp-2  =  8px        ← compact (input padding inline)
--ts-sp-3  = 12px        ← form rows, list items
--ts-sp-4  = 16px        ← default block padding, card inner gap
--ts-sp-5  = 20px        ← (rarely — only for input height = 50)
--ts-sp-6  = 24px        ← card padding (default), section header gap
--ts-sp-8  = 32px        ← section inner gap, card padding (spacious)
--ts-sp-10 = 40px        ← (rarely)
--ts-sp-12 = 48px        ← block-to-block on landing
--ts-sp-16 = 64px        ← section gap (mobile)
--ts-sp-20 = 80px        ← section gap (tablet)
--ts-sp-24 = 96px        ← section gap (desktop max)

--ts-section-pad: clamp(4rem, 8vw, 9rem)   (use this for <section> padding)
--ts-container-pad: clamp(1rem, 5vw, 4rem) (use this for left/right gutters)
```

**The rhythm rule:** padding of a container ≥ gap of its children. A card with
`padding: 24px` has children gap ≤ 24px. Breaking this rule = visual collapse.

**Container budget:** `--ts-container-lg: 1280px` (default), `xl: 1520px` (cinematic),
`md: 960px` (article), `sm: 640px` (form). Never wider than `xl` for body content;
full-bleed sections only for backgrounds/imagery.

Full layout spec → **`references/03-layout-and-spacing.md`**.

### 3.4 Shape — radius and shadow ladders

```
--ts-radius-base: 10px      (one knob — change to retheme every corner)
--ts-radius-xs:    3px      (chips, badges)
--ts-radius-sm:    5px      (buttons, inputs)
--ts-radius-md:   10px      (cards default)
--ts-radius-lg:   14px      (panels, modals)
--ts-radius-xl:   20px      (featured / hero cards)
--ts-radius-full: 9999px    (pills, avatars)

--ts-shadow-1: subtle           (raised surfaces, no hover)
--ts-shadow-2: card             (cards default)
--ts-shadow-3: float            (dropdowns, popovers)
--ts-shadow-4: dramatic         (modals, hero CTA)
--ts-shadow-accent: accent glow (CTA only, sparingly)
```

**Rule:** radius scales with size. A 40px button gets `--ts-radius-sm`; a 320px-tall
card gets `--ts-radius-lg`. Pills only for things smaller than 48px tall.

## 4 · Decision trees (the anti-doubt protocol)

When in doubt, walk the tree. Do not deliberate — execute.

### 4.1 "Which font for this project?"
```
Brand mood?
├─ Editorial / luxury / long-form → Heading: Instrument Serif | Body: Source Serif 4
├─ Tech / SaaS / dashboard       → Heading: Clash Display     | Body: Space Grotesk
├─ Friendly / consumer / playful → Heading: Cabinet Grotesk   | Body: General Sans
├─ Brutalist / editorial-poster  → Heading: Bricolage Grotesque| Body: Switzer
├─ Default (no signal)           → Heading: Space Grotesk     | Body: Space Grotesk
└─ Mono needed                   → JetBrains Mono (always)
```

### 4.2 "Which type step for this element?"
```
Hero h1, single screen ........ step 7-9 (clamp 48→80px)
Section title h2 .............. step 5-6 (clamp 36→48px)
Card title h3 ................. step 3   (28px)
Subheading / lead ............. step 1   (19px)
Body ......................... step 0   (16px)
Caption / meta ............... step -1  (13px)
Overline / badge ............. step -2 UPPERCASE +0.08em (11px)
```

### 4.3 "How much padding on this thing?"
```
Element width      Padding (inline / block)
< 100px            sp-2  / sp-2   ( 8 /  8)
100–240px          sp-3  / sp-3   (12 / 12)   ← buttons, chips
240–480px          sp-4  / sp-4   (16 / 16)   ← inputs, small cards
480–800px          sp-6  / sp-6   (24 / 24)   ← standard cards, modals
> 800px            sp-8  / sp-8   (32 / 32)   ← hero cards, panels
Full-bleed section sp-section/sp-section (clamp 4rem→9rem)
```

### 4.4 "Light or dark default?"
```
Tech / dev tools / dashboard / AI ........ dark-practical-neutral-v1
Editorial / publication / luxury ........ light-practical-clean-v1
Marketing landing (single hero) ........ dark + light tweak ready
WordPress / Enfold ..................... dark-practical-neutral-v1
```

### 4.5 "Awwwards-grade — what's the ONE move that makes this great?"
```
Have a hero?     → ONE oversized type element + 90% whitespace
Have a card grid?→ Break the symmetry: one card spans 2 (bento)
Have a list?     → Negative letter-spacing on heads, +0.08em on overlines
Have an image?   → Edge-to-edge crop OR floating with shadow-4; never half measures
Have ≥3 colors?  → You have too many. Cut to accent + 1 neutral scale.
```

Full decision flow → **`references/06-decision-trees.md`** (if present).

## 5 · The unbreakable layout primer

Three patterns cover 90% of layouts. Memorize them.

### 5.1 The auto-fit card grid (never breaks)
```css
.ts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: var(--ts-sp-6);
}
```
The `min(100%, 280px)` prevents single-column overflow on narrow screens.
`minmax(0, 1fr)` (or this min() variant) is **mandatory** — `1fr` alone overflows on long content.

### 5.2 The pinned-footer card (header-body-footer)
```css
.ts-card {
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100%;
  padding: var(--ts-sp-6);
  gap: var(--ts-sp-4);
  background: var(--ts-card-bg, var(--ts-bg-2));
  border: 1px solid var(--ts-border-1);
  border-radius: var(--ts-radius-md);
}
```
Cards in the same row are equal height **only** with `align-items: stretch` (the grid default)
AND every card uses this template. Mixed templates = jagged row.

### 5.3 The editorial split (asymmetric, magazine-grade)
```css
.ts-split {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);   /* or 2fr 3fr */
  gap: clamp(var(--ts-sp-6), 4vw, var(--ts-sp-16));
  align-items: start;
}
@media (max-width: 768px) { .ts-split { grid-template-columns: 1fr; } }
```
Asymmetric ratios (2:3, 3:5, 5:7) read as designed; 50/50 reads as default.

Full layout cookbook → **`references/03-layout-and-spacing.md`** §4.

## 6 · Hard guardrails (NEVER, under any pressure)

1. **NEVER hardcode a color.** Always `var(--ts-*)`. Use `generate-colors.js` to add new colors.
2. **NEVER use `!important`** to fix integration. Fix specificity or use `@layer`.
3. **NEVER nest `--ts-*` prefixes** with another (e.g. `--brand-ts-x`). The namespace is sacred.
4. **NEVER pick a font from memory.** Open `references/02-typography.md` §2-§3.
5. **NEVER use Inter / Roboto / Arial / system-ui** as a primary chosen font. They're fallbacks only.
6. **NEVER skip the APCA gate.** If `generate-colors.js` exits 1, the palette is rejected.
7. **NEVER use `1fr` without `minmax(0, …)`** in a grid that holds text or images.
8. **NEVER use `vh`** on full-height containers — use `dvh` (mobile safe).
9. **NEVER use raw `#hex` on accent ink.** Use the relative-color clamp formula.
10. **NEVER write a number that isn't a token.** If it doesn't exist, add it to the system first.

# 2. Design audit (lints HTML/CSS for system violations)
node scripts/audit-design.mjs <file.html>

- [ ] Padding ≥ gap (the rhythm rule, §3.3).
- [ ] Hero has one oversized element + 90% whitespace.
- [ ] Reduced-motion media query respected.

If any item fails: STOP, fix it, re-verify. Do not ship partial.

# 01 · Foundation — Color, Surfaces, the Toolskin Token Contract

> Single source of truth for color in Toolskin. Pair with `scripts/generate-colors.js`
> which emits the authoritative `colors.css` and APCA verification report.

---

## 1 · The color engine (3 knobs, everything else derives)

```css
:root {
  /* ── THE THREE KNOBS ── */
  --ts-accent-h: 18;     /* hue 0–360   18=orange · 142=green · 220=blue · 270=purple */
  --ts-accent-s: 100%;   /* saturation 0–100% */
  --ts-accent-l: 52%;    /* lightness 0–100% */
}
```

That's it. To rebrand any Toolskin site, change those three lines. Everything below
derives. **Never write a fourth knob.** If a design needs a fixed accent hex, set
the three knobs to match — do not branch.

### 1.1 Derived accent variants (do not redefine)

```css
--ts-accent:        hsl(var(--ts-accent-h) var(--ts-accent-s) var(--ts-accent-l));
--ts-accent-bright: color-mix(in srgb, var(--ts-accent), #fff 15%);
--ts-accent-dark:   color-mix(in srgb, var(--ts-accent), #000 25%);
--ts-accent-dim:    color-mix(in srgb, var(--ts-accent), transparent 82%);
--ts-accent-dim-2:  color-mix(in srgb, var(--ts-accent), transparent 92%);
--ts-accent-border: color-mix(in srgb, var(--ts-accent), transparent 60%);

/* The auto-contrast ink — NEVER hardcode white/black on accent */
--ts-on-accent: oklch(from var(--ts-accent) clamp(0, (0.75 - l) * 999, 1) 0 0);
```

### 1.2 Alt / secondary accent (one, optional, complement)

```css
--ts-alt-h: 195; --ts-alt-s: 100%; --ts-alt-l: 40%;
--ts-alt: hsl(var(--ts-alt-h) var(--ts-alt-s) var(--ts-alt-l));
```

If a brand needs three colors, that's a triadic system — set `--ts-tri-h` too.
Beyond three, the design is over-specified. Cut.

### 1.3 Status colors (semantic, do not re-derive per project)

```css
--ts-success: hsl(142 76% 36%);
--ts-warning: hsl(45  100% 50%);
--ts-danger:  hsl(0   90% 55%);
--ts-info:    hsl(210 90% 55%);
```

---

## 2 · Surfaces — the 10 curated presets

Surfaces are **not derived**. They are 10 hand-curated palettes (5 dark + 5 light)
verified against APCA targets by `generate-colors.js`. Pull from the catalog —
never invent surface hex values.

### 2.1 The defaults (use unless told otherwise)

| Mode | Preset ID | bg-body | text-primary | Use case |
|---|---|---|---|---|
| **Dark** | `dark-practical-neutral-v1` | `#0c0d0f` | `#e8e9ea` | All production |
| **Light** | `light-practical-clean-v1`  | `#f7f8f9` | `#0f1012` | All production |

### 2.2 The 6-level surface ladder (per preset)

```
--ts-bg-body  ← deepest page background (the floor)
--ts-bg-0     ← base surface
--ts-bg-1     ← mid surface
--ts-bg-2     ← standard card / panel
--ts-bg-3     ← raised surface (modals, popovers)
--ts-bg-4     ← prominent (active states)
--ts-bg-5     ← brightest (highlights)
```

**Rule:** elevation = lighter (in dark mode) or slightly darker (in light mode).
A card on `bg-body` is `bg-2`; a popover on a card is `bg-3`; a tooltip on that is `bg-4`.
Skip levels = visual hierarchy collapses.

### 2.3 Text on surfaces (APCA targets, enforced by gate)

| Token | APCA target on bg-body | Use |
|---|---|---|
| `--ts-text-primary`   | ≥ Lc 75 | Body, headings |
| `--ts-text-secondary` | ≥ Lc 45 | Subtitles, meta, captions |
| `--ts-text-muted`     | ≥ Lc 25 | Disabled, footnote, helper |
| `--ts-text-accent`    | `var(--ts-accent)` | Links, emphasis (≤ 5% of page) |
| `--ts-text-invert`    | `var(--ts-on-accent)` | On accent backgrounds |

**NEVER** put `--ts-text-primary` on `--ts-accent` — use `--ts-text-invert` /
`--ts-on-accent`. The APCA formula picks the right ink automatically.

### 2.4 Borders (derived from surface context)

```css
--ts-border-0: color-mix(in srgb, currentColor, transparent 94%);  /* hairline */
--ts-border-1: color-mix(in srgb, currentColor, transparent 90%);  /* default */
--ts-border-2: color-mix(in srgb, currentColor, transparent 84%);  /* prominent */
--ts-border-accent: var(--ts-accent-border);
```

Borders use `currentColor` so they auto-invert when text color flips. **Do not**
write a border in hex — it will desync from theme switches.

---

## 3 · Switching presets at runtime

```css
/* Default = recommended dark + recommended light */
:root, [data-theme="dark"]  { /* dark-practical-neutral-v1 tokens */ }
[data-theme="light"]        { /* light-practical-clean-v1 tokens */ }
```

To use any preset on a subtree (e.g. embedded section in alt palette):

```html
<div class="ts-preset-dark-warm-slate-v2"> …local subtree uses Classic Warm… </div>
```

The 10 preset classes are emitted by `generate-colors.js` into `colors.css`.

### 3.1 JS API
```js
Toolskin.setAccent(195, '100%', '40%');   // new HSL accent
Toolskin.setAccentHex('#2efc86');          // accept hex, convert internally
Toolskin.setPreset('dark-warm-slate-v2');  // swap surface palette
Toolskin.refresh();                        // re-scan DOM after dynamic content
```

---

## 4 · The `--ts-` prefix contract (NAMESPACE)

Every custom property introduced by Toolskin or any imported skill **must** carry
the `--ts-` prefix. This is non-negotiable.

```
--ts-[category]-[property]-[variant]-[state]

✓  --ts-accent-h           ✓  --ts-card-bg
✓  --ts-fs-h1              ✓  --ts-shadow-accent
✗  --brand-primary         ← rename to --ts-accent-h with conversion
✗  --color-bg-card         ← rename to --ts-card-bg
✗  --spacing-md            ← map to --ts-sp-4 (16px)
```

When importing external CSS:
1. Audit the source for innovations (`!important` is a red flag — fix root cause, don't keep it).
2. Map every property to an existing `--ts-*` token or add a new one cleanly.
3. Re-prefix and retest.

See `references/css-integration-discipline.md` (if installed) for the full protocol.

---

## 5 · Color decision protocol

```
Q: A new color is needed.
├─ Is it an accent variation?   → adjust --ts-accent-h/s/l. Done.
├─ Is it a status (ok/warn/err)?→ use --ts-success/warning/danger. Don't redefine.
├─ Is it a surface elevation?   → use --ts-bg-{0..5}. If none fits, the design is wrong, not the system.
├─ Is it a text role?           → primary/secondary/muted/invert. No fourth role.
└─ None of the above?           → STOP. Get owner approval before adding a top-level token.
```

```
Q: Light mode looks faded.
├─ Did you swap --ts-bg-* and --ts-text-* together?  → that's mandatory
├─ Did you desaturate accent?                         → DON'T. Same accent across modes.
├─ Did you reduce shadow opacity?                     → no, use the same scale; shadows look fine
└─ Did you run APCA?                                  → run generate-colors.js
```

---

## 6 · The APCA gate (HALT condition)

Before any palette change ships, `generate-colors.js` MUST exit 0.

```
APCA targets (text on bg-body):
  text-primary   ≥ Lc 75   (comfortable reading)
  text-secondary ≥ Lc 45   (large/heavy text)
  text-muted     ≥ Lc 25   (non-text minimum)
```

The runtime tuner (`_toolskinApplyContrastToTokenMap` in `toolskin.js`) further
nudges secondary/muted at runtime — but the curated base values must meet the
floor before tuning.

If a palette fails: do not relax the target. Adjust the surface hex by 2–3 luminance
units and re-verify. If still failing, the palette is rejected.

---

## 7 · WordPress / Enfold bridge

Enfold (and most WP themes) consume their own variable names. Toolskin powers them
via a one-way bridge in the child theme CSS:

```css
:root {
  --maincolor:     var(--ts-accent);
  --orange:        var(--ts-accent);
  --orange-2:      var(--ts-alt);
  --altcolor:      var(--ts-alt);
  --darkbg2:       var(--ts-bg-body);
  --darkbg:        var(--ts-bg-2);
  --darkbg-1:      var(--ts-bg-1);
  --border-radius: var(--ts-radius-md);
  --mainfont:      var(--ts-font-body);
  --titlefont:     var(--ts-font-display);
}
```

**Rule:** the bridge is one-directional. Toolskin writes; Enfold reads. Never write
`--maincolor: #...` directly — set the `--ts-*` source and let it flow.

---

## 8 · The catalog (use these IDs verbatim)

```
DARK PRESETS:
  dark-neutral-cool-v1     Classic V1 Neutral Cool
  dark-warm-slate-v2       Classic V2 Warm Slate
  dark-blue-tinted-v3      Classic V3 Blue-Tinted Professional
  dark-practical-neutral-v1 ★ Practical Neutral (DEFAULT)
  dark-practical-cool-v2   Practical Slightly Cool

LIGHT PRESETS:
  light-neutral-clean-v1   Classic V1 Neutral Clean
  light-warm-paper-v2      Classic V2 Warm Paper
  light-cool-professional-v3 Classic V3 Cool Professional
  light-practical-clean-v1 ★ Practical Clean (DEFAULT)
  light-practical-cool-v2  Practical Slightly Cool
```

The full token map per preset lives in `docs/references/surface-presets-catalog.json`
(emitted by the generator). Read it; don't reproduce values here.

# 02 · Typography — The 1.200 Ladder, Pairings, and Hierarchy

> Every type decision in Toolskin resolves through this file. No font picked from
> memory. No size off-ladder. No line-height invented.

---

## 1 · The locked 1.200 ladder (minor third)

Why 1.200: dense enough for editorial and dashboards, open enough for marketing.
Major third (1.250) is too operatic for body-heavy UI; major second (1.125) is too
subtle for hierarchy.

```css
--ts-fs-base: 16px;
--ts-fs-ratio: 1.200;

--ts-fs--2: calc(var(--ts-fs-base) / var(--ts-fs-ratio) / var(--ts-fs-ratio)); /* 11.11px */
--ts-fs--1: calc(var(--ts-fs-base) / var(--ts-fs-ratio));                      /* 13.33px */
--ts-fs-0:  var(--ts-fs-base);                                                  /* 16.00px */
--ts-fs-1:  calc(var(--ts-fs-base) * var(--ts-fs-ratio));                      /* 19.20px */
--ts-fs-2:  calc(var(--ts-fs-1)    * var(--ts-fs-ratio));                      /* 23.04px */
--ts-fs-3:  calc(var(--ts-fs-2)    * var(--ts-fs-ratio));                      /* 27.65px */
--ts-fs-4:  calc(var(--ts-fs-3)    * var(--ts-fs-ratio));                      /* 33.18px */
--ts-fs-5:  calc(var(--ts-fs-4)    * var(--ts-fs-ratio));                      /* 39.81px */
--ts-fs-6:  calc(var(--ts-fs-5)    * var(--ts-fs-ratio));                      /* 47.78px */
--ts-fs-7:  calc(var(--ts-fs-6)    * var(--ts-fs-ratio));                      /* 57.33px */
--ts-fs-8:  calc(var(--ts-fs-7)    * var(--ts-fs-ratio));                      /* 68.80px */
--ts-fs-9:  calc(var(--ts-fs-8)    * var(--ts-fs-ratio));                      /* 82.55px */
```

### 1.1 Role mapping (use these, not raw steps)

```css
--ts-fs-micro:    var(--ts-fs--2);   /* 11px — overlines, legal */
--ts-fs-caption:  var(--ts-fs--1);   /* 13px — meta, helpers */
--ts-fs-body:     var(--ts-fs-0);    /* 16px — paragraph */
--ts-fs-lead:     var(--ts-fs-1);    /* 19px — subtitle / intro */
--ts-fs-h5:       var(--ts-fs-2);    /* 23px */
--ts-fs-h4:       var(--ts-fs-3);    /* 28px */
--ts-fs-h3:       var(--ts-fs-4);    /* 33px */
--ts-fs-h2:       var(--ts-fs-5);    /* 40px */
--ts-fs-h1:       var(--ts-fs-6);    /* 48px */
--ts-fs-display:  clamp(var(--ts-fs-6), 4vw + 1rem, var(--ts-fs-8));  /* 48→69px */
--ts-fs-hero:     clamp(var(--ts-fs-7), 8vw + 1rem, var(--ts-fs-9));  /* 57→83px */
```

### 1.2 Line-height by role (the locked pairs)

```css
--ts-lh-tight:    0.92;   /* hero only (step 9) */
--ts-lh-display:  1.05;   /* display (steps 7-8) */
--ts-lh-headline: 1.15;   /* h1-h2 (steps 5-6) */
--ts-lh-snug:     1.3;    /* h3-h5 (steps 2-4) */
--ts-lh-normal:   1.5;    /* body, lead */
--ts-lh-loose:    1.65;   /* long-form prose, blockquotes */
```

| Step | Line-height | Why |
|---:|---|---|
| 9 | 0.92–1.0 | Massive type stacks need negative leading to look unified |
| 7-8 | 1.05 | Display reads as one shape, not a paragraph |
| 5-6 | 1.15 | Two-line headlines need enough air without floating apart |
| 3-4 | 1.25–1.3 | Card titles, subheads; readable in tight contexts |
| 0-2 | 1.45–1.5 | Body; 1.5 is the ideal reading rhythm |
| -2/-1 | 1.4 | Small text gets slightly tighter; 1.5 looks loose |

### 1.3 Letter-spacing (the locked pairs)

```css
--ts-tracking-tightest:  -0.04em;   /* hero (step 9) */
--ts-tracking-tighter:   -0.025em;  /* display (steps 7-8) */
--ts-tracking-tight:     -0.015em;  /* h1-h3 (steps 4-6) */
--ts-tracking-snug:      -0.005em;  /* h4-h5 (steps 2-3) */
--ts-tracking-normal:     0;        /* body, lead */
--ts-tracking-wide:       0.02em;   /* captions (step -1) */
--ts-tracking-wider:      0.08em;   /* overlines (step -2 UPPERCASE) */
--ts-tracking-widest:     0.16em;   /* tiny labels in cards */
```

**Negative tracking is mandatory at sizes ≥ 33px.** Without it, type at scale looks
spaced-out and amateur.

---

## 2 · Heading fonts (display) — pick by mood

| Font | Mood | Source | Pair with body |
|---|---|---|---|
| **Clash Display** ★ default | Confident tech, neo-grotesk | Fontshare | Space Grotesk |
| **Cabinet Grotesk** | Friendly modern | Fontshare | General Sans |
| **Bricolage Grotesque** | Editorial-poster, brutalist | Google Fonts | Switzer |
| **Instrument Serif** | Editorial, luxury, magazine | Google Fonts | Source Serif 4 |
| **Fraunces** | Quirky-warm display serif | Google Fonts | Newsreader |
| **Syne** | Futuristic, art-deco | Google Fonts | Inter (light only) |
| **Unbounded** | Web3 / experimental | Google Fonts | Switzer |
| **Playfair Display** | Classical luxury (display ONLY) | Google Fonts | Lora |
| **Space Grotesk** | Engineering / neutral | Google Fonts | Space Grotesk (single-family) |
| **DM Serif Display** | Editorial classical | Google Fonts | DM Sans |

**Banned defaults:** Inter, Roboto, Arial, system-ui, sans-serif. These are *fallbacks*,
not *choices*. Pick from above.

---

## 3 · Body fonts — pick by reading load

| Font | Best for | Source | x-height | Notes |
|---|---|---|---|---|
| **Space Grotesk** ★ default | UI, dashboards, dev tools | Google Fonts | Tall | The Toolskin anchor |
| **General Sans** | Marketing, friendly SaaS | Fontshare | Medium | Modern rationalist |
| **Switzer** | "Free Helvetica," editorial | Fontshare | Tall | 18 styles |
| **Geist** | Dev tools, tech | Google Fonts | Tall | Vercel-clean |
| **Source Serif 4** | Long-form, articles | Google Fonts | Medium | Pairs Source Sans |
| **Newsreader** | Magazine, blog | Google Fonts | Tall | 42 styles, screen-tuned |
| **Lora** | Editorial body | Google Fonts | Medium | Calligraphic warmth |

**Body rule:** 16px minimum (step 0). 18px on landing pages with sparse content
(step 1). Below 16 only for `caption` / `micro` roles.

**Reading length:** body text gets `max-width: 65ch` (≈ 600px). Wider is faster
to skim but harder to read. Use `max-width: 80ch` only for dashboards.

---

## 4 · Mono fonts — when there is code or data

```css
--ts-font-mono: "JetBrains Mono", "Space Mono", "Fira Code", ui-monospace, monospace;
```

| Font | Use | Source |
|---|---|---|
| **JetBrains Mono** ★ default | Code, terminal | Google Fonts |
| **Space Mono** | Pairs with Space Grotesk (same DNA) | Google Fonts |
| **Geist Mono** | Pairs with Geist | Google Fonts |
| **Fira Code** | Heavy ligature use | Google Fonts |
| **Recursive Mono** | One file, sans+mono in one | Google Fonts |

**Rule:** mono only when there is real code, hashes, or columnar numeric data.
Don't use mono "for vibe" — it always reads as terminal.

---

## 5 · Loading strategy

```html
<!-- In <head>, RENDER-BLOCKING (Toolskin anchor) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Clash+Display:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Clash+Display:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
```

```css
@font-face {
  font-family: 'Space Grotesk';
  font-display: swap;          /* swap for most cases; optional for best CWV */
  font-weight: 300 700;        /* variable range, one file */
}
```

**Self-host** when possible (`.woff2` only). Preload the body font; let display
swap in. Maximum 2 families loaded at once.

---

## 6 · Decision tree: "Which type step for THIS element?"

```
Is it the page hero (one screen, one element)?
├─ YES → step 7-9 (--ts-fs-hero, clamp 57→83px)
└─ NO  → continue

Is it a section title (above an aside / below nav)?
├─ YES → step 5-6 (--ts-fs-h1 or h2)
└─ NO  → continue

Is it the title of a card / panel / list item?
├─ YES → step 3-4 (--ts-fs-h3 or h4)
└─ NO  → continue

Is it a subtitle / lead paragraph?
├─ YES → step 1 (--ts-fs-lead, 19px)
└─ NO  → continue

Is it the actual reading text?
├─ YES → step 0 (--ts-fs-body, 16px)
└─ NO  → continue

Is it metadata, helper text, timestamp?
├─ YES → step -1 (--ts-fs-caption, 13px)
└─ NO  → continue

Is it an overline / category / kicker (UPPERCASE)?
└─ step -2 + UPPERCASE + tracking +0.08em
```

---

## 7 · Hierarchy patterns (the three canonical compositions)

### 7.1 The classical (display + body)
```
DISPLAY (step 8, 69px, weight 700, tracking -0.025em, lh 1.05)
↓ gap 24px
Lead paragraph (step 1, 19px, weight 400, tracking 0, lh 1.45)
↓ gap 32px
Two CTAs side-by-side
```

### 7.2 The editorial (overline + headline + body)
```
OVERLINE (step -2, 11px, weight 600, UPPERCASE, tracking +0.08em, color: --ts-text-secondary)
↓ gap 12px
Headline (step 5, 40px, weight 600, tracking -0.02em, lh 1.15)
↓ gap 20px
Body (step 0, 16px, weight 400, lh 1.6, max-width 65ch)
```

### 7.3 The dashboard (eyebrow + metric + delta)
```
Eyebrow (step -1, 13px, weight 500, color: --ts-text-secondary)
↓ gap 8px
Metric (step 5, 40px, weight 700, mono numerals, tracking -0.02em)
↓ gap 4px
Delta (step -1, 13px, weight 500, color: success/danger)
```

---

## 8 · Hierarchy rule (the meta-rule)

**Hierarchy comes from contrast, not from variety.**

- 2 type sizes + 2 weights ≥ 6 type sizes + 1 weight
- 1 family + weight contrast ≥ 3 families
- Color contrast ≥ size contrast for short labels
- White space contrast ≥ all of the above for sections

If a layout feels flat: don't add a font, increase the size delta between primary
and secondary text by one step. If it still feels flat: increase the weight delta
(400 → 700, not 400 → 500). If still flat: increase whitespace around the primary
element by 2× before touching anything else.

---

## 9 · Anti-patterns (forbidden)

- ❌ More than 2 type families on one page (mono is a third only when justified).
- ❌ Headlines at 1.5 line-height (looks like a paragraph).
- ❌ Body at 1.2 line-height (unreadable).
- ❌ Positive letter-spacing on display type (looks decorative).
- ❌ Bold + italic + underline on the same word.
- ❌ All-caps body text (reduces reading speed 13–20%).
- ❌ Justified text on the web (rivers — use `text-align: left`).
- ❌ `font-size: 12px` for anything a user must read (caption floor is 13px).
- ❌ Sentence-case overlines (overlines are UPPERCASE).
- ❌ Color as the ONLY hierarchy signal (also use size or weight).

---

# 03 · Layout & Spacing — The Harmonic System

> Layouts that don't break. Spacing that breathes. Grids that hold their shape from
> 320 to 2560px. Every value below is a token; every recipe below is locked.

---

## 1 · The 8pt grid (the rhythm)

Toolskin uses a **4px base unit, 8pt grid for spacing**. Every visible gap, padding,
or margin resolves to a `--ts-sp-*` token. No raw px in your CSS.

```css
--ts-sp-base: 4px;

--ts-sp-1   =  4px        /* hairline */
--ts-sp-2   =  8px        /* compact (icon-text gap, badge inner) */
--ts-sp-3   = 12px        /* form rows, list items */
--ts-sp-4   = 16px        /* default block padding, card inner gap */
--ts-sp-5   = 20px        /* rare — only when 16 is too tight and 24 too loose */
--ts-sp-6   = 24px        /* card padding default, section header gap */
--ts-sp-8   = 32px        /* spacious card padding, dense section gap */
--ts-sp-10  = 40px        /* rare */
--ts-sp-12  = 48px        /* block-to-block on landings */
--ts-sp-16  = 64px        /* section gap (mobile) */
--ts-sp-20  = 80px        /* section gap (tablet) */
--ts-sp-24  = 96px        /* section gap (desktop max) */
--ts-sp-32  = 128px       /* dramatic separation (hero only) */
```

### 1.1 Fluid spacing tokens (preferred for sections)

```css
--ts-section-pad:    clamp(4rem, 8vw, 9rem);      /* 64 → 144px */
--ts-section-gap:    clamp(4rem, 8vw, 9rem);      /* between sections */
--ts-container-pad:  clamp(1rem, 5vw, 4rem);      /* page gutter */
--ts-block-gap:      clamp(2rem, 5vw, 4rem);      /* block-to-block within a section */
```

Use the fluid tokens for top-level layout; fixed `--ts-sp-*` for component-internal spacing.

---

## 2 · The rhythm rule (the unbreakable law)

> **`padding` of a container ≥ `gap` between its children.**

If a card has `padding: 24px`, its children's `gap` is **at most 24px** (ideally 16).
Break this and the design looks careless — children touch the container walls
while floating apart from each other.

| Container padding | Children gap (max) | Children gap (preferred) |
|---:|---:|---:|
| sp-3 (12) | 8  | 8  |
| sp-4 (16) | 12 | 8  |
| sp-6 (24) | 20 | 16 |
| sp-8 (32) | 24 | 20 |
| section-pad | block-gap | block-gap (fluid) |

Same rule for nested grids: outer gap ≥ inner gap by one step.

---

## 3 · Container budgets (the width contract)

A page is a stack of containers. Each container has a max-width budget. Cross it
and content reads as cramped (too narrow) or sprawled (too wide).

```css
--ts-container-sm:  640px;   /* forms, single-column articles */
--ts-container-md:  960px;   /* 2-col cards, narrow editorial */
--ts-container-lg: 1280px;   /* default — dashboards, marketing */
--ts-container-xl: 1520px;   /* cinematic — hero + 3-col grids */
--ts-container-2xl: 1760px;  /* full bento with imagery */

/* Reading widths (NOT container widths) */
--ts-read-prose:  65ch;      /* body paragraphs (≈ 600px) */
--ts-read-wide:   80ch;      /* dashboard descriptions */
```

### 3.1 The full-bleed pattern (background to edge, content centered)

```css
.ts-section {
  /* The section itself goes edge to edge */
  width: 100%;
  padding-inline: var(--ts-container-pad);
  padding-block:  var(--ts-section-pad);
  background: var(--ts-bg-1);
}
.ts-section > .ts-container {
  /* Content lives inside the budget */
  max-width: var(--ts-container-lg);
  margin-inline: auto;
}
```

Never put the background on `.ts-container` — backgrounds belong to sections,
not to content boxes.

---

## 4 · The three layout primitives (90% of layouts)

### 4.1 The auto-fit card grid (unbreakable)

```css
.ts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: var(--ts-sp-6);
}
```

**Why this incantation:**
- `auto-fit` collapses empty tracks (vs `auto-fill` which leaves ghost columns)
- `minmax(min(100%, 280px), 1fr)` lets the card go full-width on narrow screens
  instead of overflowing horizontally — this is the safety belt that prevents most
  "card broke at 360px" bugs.

**Variants:**
```css
.ts-grid--tight   { gap: var(--ts-sp-4); --min: 220px; }
.ts-grid--spacious{ gap: var(--ts-sp-8); --min: 320px; }
.ts-grid--bento   { /* see §5.2 below */ }
```

### 4.2 The split (asymmetric, magazine-grade)

```css
.ts-split {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);   /* 5:7 — the magazine ratio */
  gap: clamp(var(--ts-sp-6), 4vw, var(--ts-sp-16));
  align-items: start;
}
@media (max-width: 768px) {
  .ts-split { grid-template-columns: 1fr; }
}
```

**Ratio menu** (pick one, never 50/50):
```
2fr 3fr   → 40:60   editorial, image-right
3fr 2fr   → 60:40   text-heavy hero
5fr 7fr   → 42:58   magazine standard
3fr 5fr   → 38:62   sidebar layouts
1fr 2fr   → 33:66   nav-and-content
```

50/50 reads as "default" — only use it intentionally for symmetric pairs
(e.g. before/after, two CTAs side-by-side).

### 4.3 The header-body-footer card (vertically pinned)

```css
.ts-stack {
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100%;
  gap: var(--ts-sp-4);
}
```

The `1fr` middle row absorbs all extra space, pinning header to top and footer to
bottom regardless of content length. Cards in the same row stay equal height.

---

## 5 · Higher-order patterns

### 5.1 The reading column (long-form content)

```css
.ts-prose {
  max-width: 65ch;
  margin-inline: auto;
  font-size: var(--ts-fs-lead);     /* 19px — long-form gets larger body */
  line-height: var(--ts-lh-loose);  /* 1.65 */
}
.ts-prose > * + * { margin-top: var(--ts-sp-4); }
.ts-prose > h2 + * { margin-top: var(--ts-sp-2); }     /* headings stay close to their body */
.ts-prose > * + h2 { margin-top: var(--ts-sp-12); }    /* big air above new sections */
```

### 5.2 The bento grid (dashboard / marketing)

```css
.ts-bento {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: minmax(180px, auto);
  gap: var(--ts-sp-6);
  grid-auto-flow: dense;        /* dense packs holes */
}

/* Tile spans */
.ts-bento__hero  { grid-column: span 8; grid-row: span 2; }
.ts-bento__wide  { grid-column: span 8; }
.ts-bento__tall  { grid-column: span 4; grid-row: span 2; }
.ts-bento__half  { grid-column: span 6; }
.ts-bento__third { grid-column: span 4; }
.ts-bento__quart { grid-column: span 3; }

@media (max-width: 960px) {
  .ts-bento { grid-template-columns: repeat(6, 1fr); }
  .ts-bento__hero, .ts-bento__wide { grid-column: span 6; }
  .ts-bento__tall, .ts-bento__half { grid-column: span 3; }
  .ts-bento__third, .ts-bento__quart { grid-column: span 3; }
}
@media (max-width: 560px) {
  .ts-bento { grid-template-columns: 1fr; }
  .ts-bento > * { grid-column: 1; grid-row: auto; }
}
```

### 5.3 The dashboard frame (sidenav + topbar + content)

```css
.ts-app {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas:
    "nav  topbar"
    "nav  main";
  min-height: 100dvh;
}
.ts-app__nav    { grid-area: nav;    background: var(--ts-bg-1); border-right: 1px solid var(--ts-border-1); }
.ts-app__topbar { grid-area: topbar; background: var(--ts-bg-0); border-bottom: 1px solid var(--ts-border-1); }
.ts-app__main   { grid-area: main;   overflow: auto; padding: var(--ts-sp-8); }

@media (max-width: 960px) {
  .ts-app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
  .ts-app__nav { display: none; }  /* collapse to drawer on mobile */
}
```

---

## 6 · Container queries (component-level adaptation)

Container queries adapt a component to its OWN width, not the viewport. Use them
when a card needs different layout at different placements (e.g. sidebar vs main).

```css
.ts-card-wrapper {
  container-type: inline-size;
  container-name: card;
}

.ts-card { display: grid; gap: var(--ts-sp-4); }

@container card (min-width: 480px) {
  .ts-card { grid-template-columns: 96px 1fr; }   /* icon + body side-by-side */
}
@container card (min-width: 720px) {
  .ts-card { grid-template-columns: 96px 1fr auto; }  /* + trailing action */
}
```

**Rule:** media queries for PAGE layout (column count, sidebar visibility),
container queries for COMPONENT layout (card going from stacked to inline).

---

## 7 · Breakpoint contract

```css
/* Mobile-first. Base styles = 0-479px. */
@media (min-width: 480px)  { /* sm — mobile landscape */ }
@media (min-width: 768px)  { /* md — tablet portrait */ }
@media (min-width: 1024px) { /* lg — laptop */ }
@media (min-width: 1280px) { /* xl — desktop */ }
@media (min-width: 1536px) { /* 2xl — large desktop */ }
```

**Rule:** the layout primitives (§4) should work at ALL widths without media queries
thanks to `auto-fit` + `clamp()` + `minmax()`. Media queries are an escape hatch,
not a default tool.

---

## 8 · The harmonic ladder cheat sheet

Pair these values together — they belong on the same level.

| Level | Padding | Gap (children) | Radius | Type role | Shadow |
|---|---|---|---|---|---|
| **Hairline** | sp-1 (4) | — | xs (3) | micro -2 | — |
| **Tight** | sp-2 (8) | sp-1 (4) | xs (3) | caption -1 | — |
| **Compact** | sp-3 (12) | sp-2 (8) | sm (5) | body 0 | shadow-1 |
| **Default** | sp-4 (16) | sp-3 (12) | md (10) | body 0 | shadow-1 |
| **Card**    | sp-6 (24) | sp-4 (16) | md (10) | h4 step 3 | shadow-2 |
| **Panel**   | sp-8 (32) | sp-6 (24) | lg (14) | h3 step 4 | shadow-3 |
| **Hero**    | sp-16 (64) | sp-12 (48) | xl (20) | hero step 7+ | shadow-4 |

**Crossing levels causes visual collapse.** A card with hero radius looks like
a sticker; a hero with card padding looks anemic. Stay on a level.

---

## 9 · The vertical rhythm (baseline grid alternative)

We don't enforce a strict baseline grid in Toolskin (variable type heights make it
fragile), but we DO enforce vertical rhythm via `--ts-sp-*` between blocks.

```
Block stack (top → bottom):
  Overline    ─┐
              │  gap sp-2 (8px)
  Headline   ─┤
              │  gap sp-4 (16px)
  Lead       ─┤
              │  gap sp-6 (24px)
  Body       ─┤
              │  gap sp-12 (48px)   ← bigger gap = new logical section
  Next h2    ─┘
```

The gap *between* a heading and its body is **smaller** than the gap *before*
the next heading. This is the Gestalt proximity principle made concrete.

---

## 10 · Anti-patterns

- ❌ `margin: 16px 8px` — use `gap` and `padding`, never asymmetric margin.
- ❌ `grid-template-columns: 1fr 1fr 1fr` — collapses on text overflow. Use `minmax(0, 1fr)`.
- ❌ `width: 100vw` — causes horizontal scroll on macOS scrollbars. Use `100%`.
- ❌ `height: 100vh` — breaks on mobile address bar. Use `100dvh`.
- ❌ Fixed `width: 1200px` containers — use `max-width` with `margin: auto`.
- ❌ `padding-top: 80px` for a section. Use `--ts-section-pad`.
- ❌ Different gap values inside the same grid level.
- ❌ Negative margins to "pull" elements (cause stacking-context surprises).
- ❌ `position: absolute` for layout (vs decoration). Use grid placement.
- ❌ Hidden overflow on body (kills scroll on iOS). Lock scroll on a child instead.

---

## 11 · The "this won't break" test

For any layout you build, mentally check:

1. **Narrow content test** — viewport 320px wide, longest English word (~25 chars).
   Does anything overflow? Use `min(100%, X)` patterns to fix.

2. **Long content test** — paragraph 5× normal length. Does layout shift, or just
   the card grow taller? `1fr` and `minmax(0, ...)` matter here.

3. **Zoom test** — browser zoom 200%. Does layout collapse cleanly to mobile state?
   If columns crush, breakpoint is too late — move it to a `clamp()` or use container queries.

4. **No-image test** — disable images. Does layout still hold shape? If cards
   collapse, you put critical sizing on the image instead of the card.

5. **RTL test** — `dir="rtl"`. Does anything look broken? Use logical properties
   (`padding-inline`, `margin-block`, `inset-inline-start`) over physical.

If you can answer "yes, holds" to all five, the layout passes. Otherwise it's
not done.

# 04 · Cards & Containers — Ten Recipes That Don't Break

> The card is the workhorse of UI. Get the card right and 60% of any design is done.
> These ten recipes are copy-paste, locked, and tested. Pick one — do not invent.

---

## How to read this reference

Each recipe specifies:
- **Anatomy** — the slots and their roles
- **Dimensions** — padding, gap, radius, min-height
- **Tokens used** — every `--ts-*` referenced
- **HTML** — canonical markup (with semantic landmarks)
- **CSS** — full styles, ready to drop in
- **States** — default, hover, focus-visible, active, disabled, loading, error
- **Pitfalls** — what breaks this card

---

## Recipe 0 · The Base Card (`.ts-card`)

The atom. All other recipes inherit from this.

```
┌─────────────────────────────────────┐   padding: 24
│  HEADER (auto)                       │
│  ─────────────────────              │
│                                      │   gap: 16
│  BODY (1fr — grows)                  │
│                                      │
│  ─────────────────────              │   gap: 16
│  FOOTER (auto)                       │
└─────────────────────────────────────┘
```

```css
.ts-card {
  display: grid;
  grid-template-rows: auto 1fr auto;
  min-height: 100%;
  padding: var(--ts-sp-6);
  gap: var(--ts-sp-4);
  background: var(--ts-card-bg, var(--ts-bg-2));
  border: 1px solid var(--ts-card-border, var(--ts-border-1));
  border-radius: var(--ts-radius-md);
  box-shadow: var(--ts-shadow-1);
  color: var(--ts-text-primary);
  transition: border-color var(--ts-dur-base) var(--ts-ease-out),
              transform     var(--ts-dur-base) var(--ts-ease-out),
              box-shadow    var(--ts-dur-base) var(--ts-ease-out);
}
.ts-card__title { font-size: var(--ts-fs-h4); line-height: var(--ts-lh-snug); letter-spacing: var(--ts-tracking-tight); font-weight: 600; }
.ts-card__meta  { font-size: var(--ts-fs-caption); color: var(--ts-text-secondary); }
.ts-card__body  { color: var(--ts-text-primary); }
.ts-card__footer{ display: flex; gap: var(--ts-sp-3); align-items: center; }
```

**Hover (interactive cards only):**
```css
.ts-card--interactive:hover {
  border-color: var(--ts-border-2);
  transform: translateY(-2px);
  box-shadow: var(--ts-shadow-2);
}
.ts-card--interactive:focus-visible {
  outline: 2px solid var(--ts-accent);
  outline-offset: 2px;
}
```

**Pitfalls:**
- ❌ Removing `min-height: 100%` → cards in a row mismatch heights.
- ❌ Using `flex-direction: column` → footer doesn't pin. Use the grid.
- ❌ Box-shadow on every card → noisy. Default is shadow-1; only featured gets more.

---

## Recipe 1 · The Stat Card (`.ts-card--stat`)

Dashboard tile with eyebrow → metric → delta.

```html
<article class="ts-card ts-card--stat">
  <p class="ts-card__eyebrow">Monthly Recurring Revenue</p>
  <div class="ts-card__metric">$248,400</div>
  <div class="ts-card__delta ts-card__delta--up">
    <svg width="12" height="12">…</svg> +12.4% vs last month
  </div>
</article>
```

```css
.ts-card--stat {
  gap: var(--ts-sp-2);
  padding: var(--ts-sp-6);
}
.ts-card__eyebrow {
  font-size: var(--ts-fs-caption);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: var(--ts-tracking-wider);
  color: var(--ts-text-secondary);
}
.ts-card__metric {
  font-size: var(--ts-fs-h2);
  font-weight: 700;
  line-height: var(--ts-lh-tight);
  letter-spacing: var(--ts-tracking-tight);
  font-feature-settings: "tnum" 1, "lnum" 1;   /* tabular figures */
}
.ts-card__delta {
  font-size: var(--ts-fs-caption);
  display: inline-flex;
  align-items: center;
  gap: var(--ts-sp-1);
}
.ts-card__delta--up   { color: var(--ts-success); }
.ts-card__delta--down { color: var(--ts-danger); }
```

**Pitfalls:**
- ❌ Proportional figures → numbers jitter between widths. **`tnum`** is mandatory.
- ❌ Metric below 28px → loses the "headline" feel. Stay step 4+ (33px+).

---

## Recipe 2 · The Feature Card (`.ts-card--feature`)

Icon + title + description. The marketing workhorse.

```html
<article class="ts-card ts-card--feature">
  <div class="ts-card__icon"><svg>…</svg></div>
  <h3 class="ts-card__title">Real-time collaboration</h3>
  <p class="ts-card__body">Multiplayer cursors and presence built-in. Your team sees changes the moment you make them.</p>
  <a class="ts-card__link" href="#">Learn more →</a>
</article>
```

```css
.ts-card--feature {
  padding: var(--ts-sp-8);
  gap: var(--ts-sp-4);
  grid-template-rows: auto auto 1fr auto;   /* icon, title, body, link */
}
.ts-card--feature .ts-card__icon {
  width: 48px; height: 48px;
  display: grid; place-items: center;
  background: var(--ts-accent-dim);
  color: var(--ts-accent);
  border-radius: var(--ts-radius-sm);
  margin-bottom: var(--ts-sp-2);
}
.ts-card--feature .ts-card__body {
  color: var(--ts-text-secondary);
  font-size: var(--ts-fs-body);
  line-height: var(--ts-lh-normal);
  max-width: 40ch;
}
.ts-card--feature .ts-card__link {
  color: var(--ts-text-accent);
  font-weight: 500;
  text-decoration: none;
}
```

**Pitfalls:**
- ❌ Icon background = solid accent → reads as button. Use `--ts-accent-dim` (12% accent).
- ❌ Body wider than 40ch → looks airy. Cap at 40ch in cards.

---

## Recipe 3 · The Media Card (`.ts-card--media`)

Image-led card. Image fills width, content sits below.

```html
<article class="ts-card ts-card--media">
  <figure class="ts-card__media">
    <img src="…" alt="…" loading="lazy">
  </figure>
  <div class="ts-card__inner">
    <p class="ts-card__meta">Article · 6 min read</p>
    <h3 class="ts-card__title">The radical return to minimal interfaces</h3>
    <p class="ts-card__body">A look at how the industry is stripping away shadows, gradients, and noise.</p>
  </div>
</article>
```

```css
.ts-card--media {
  padding: 0;                              /* image goes edge to edge */
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
}
.ts-card--media .ts-card__media {
  aspect-ratio: 16 / 9;
  margin: 0;
  overflow: hidden;
  background: var(--ts-bg-3);              /* skeleton */
}
.ts-card--media .ts-card__media img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform var(--ts-dur-slow) var(--ts-ease-out);
}
.ts-card--media:hover .ts-card__media img { transform: scale(1.04); }
.ts-card--media .ts-card__inner {
  padding: var(--ts-sp-6);
  display: grid;
  gap: var(--ts-sp-3);
}
```

**Pitfalls:**
- ❌ No `aspect-ratio` on the media slot → cards in a row misalign while images load.
- ❌ `object-fit: contain` → letterboxing. Always `cover` for cards.

---

## Recipe 4 · The Person Card (`.ts-card--person`)

Avatar + name + meta + bio. Team pages, profiles.

```html
<article class="ts-card ts-card--person">
  <img class="ts-card__avatar" src="…" alt="">
  <h3 class="ts-card__title">Duane J. Hobbs</h3>
  <p class="ts-card__meta">Design Engineer</p>
  <p class="ts-card__body">Crafts clean, user-centric digital experiences focused on minimal aesthetics and strong typography.</p>
</article>
```

```css
.ts-card--person {
  text-align: center;
  padding: var(--ts-sp-8) var(--ts-sp-6);
  gap: var(--ts-sp-2);
  grid-template-rows: auto auto auto 1fr;
}
.ts-card--person .ts-card__avatar {
  width: 96px; height: 96px;
  border-radius: var(--ts-radius-full);
  object-fit: cover;
  margin: 0 auto var(--ts-sp-2);
  border: 2px solid var(--ts-border-1);
}
.ts-card--person .ts-card__body {
  color: var(--ts-text-secondary);
  margin: var(--ts-sp-2) auto 0;
  max-width: 36ch;
}
```

**Pitfalls:**
- ❌ Avatar without explicit width/height → layout shift on load.
- ❌ Square avatar with `border-radius: 50%` and missing `object-fit` → image stretches.

---

## Recipe 5 · The Pricing Card (`.ts-card--price`)

Plan name + price + feature list + CTA. The conversion machine.

```html
<article class="ts-card ts-card--price ts-card--featured">
  <header class="ts-card__header">
    <p class="ts-card__eyebrow">Pro</p>
    <p class="ts-card__price">$29<span>/mo</span></p>
    <p class="ts-card__sub">Billed annually. $35/mo billed monthly.</p>
  </header>
  <ul class="ts-card__features">
    <li><svg>✓</svg> Unlimited projects</li>
    <li><svg>✓</svg> Real-time collaboration</li>
    <li><svg>✓</svg> Priority support</li>
  </ul>
  <footer class="ts-card__footer">
    <a class="ts-btn ts-btn--primary ts-btn--full" href="#">Start free trial</a>
  </footer>
</article>
```

```css
.ts-card--price {
  padding: var(--ts-sp-8);
  gap: var(--ts-sp-6);
}
.ts-card--price .ts-card__price {
  font-size: var(--ts-fs-h1);
  font-weight: 700;
  letter-spacing: var(--ts-tracking-tight);
  line-height: var(--ts-lh-tight);
  font-feature-settings: "tnum" 1;
}
.ts-card--price .ts-card__price span {
  font-size: var(--ts-fs-body);
  color: var(--ts-text-secondary);
  font-weight: 400;
  margin-inline-start: 4px;
}
.ts-card--price .ts-card__sub { color: var(--ts-text-muted); font-size: var(--ts-fs-caption); }
.ts-card--price .ts-card__features {
  list-style: none;
  padding: 0; margin: 0;
  display: grid;
  gap: var(--ts-sp-3);
}
.ts-card--price .ts-card__features li {
  display: grid; grid-template-columns: 16px 1fr; align-items: center;
  gap: var(--ts-sp-2);
}
.ts-card--featured {
  border-color: var(--ts-accent-border);
  box-shadow: var(--ts-shadow-3), 0 0 0 1px var(--ts-accent-border);
  position: relative;
}
.ts-card--featured::before {
  content: "Most popular";
  position: absolute;
  top: 0; left: var(--ts-sp-6);
  transform: translateY(-50%);
  font-size: var(--ts-fs-micro);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: var(--ts-tracking-wider);
  padding: 4px 10px;
  background: var(--ts-accent);
  color: var(--ts-on-accent);
  border-radius: var(--ts-radius-full);
}
```

**Pitfalls:**
- ❌ Equal-height pricing cards via `align-items: stretch` are not enough if feature
  lists differ. Add `min-height` to features grid to align CTAs across cards.
- ❌ Featured card gets a different padding → throws the row off. Same padding,
  different border/shadow only.

---

## Recipe 6 · The Testimonial Card (`.ts-card--quote`)

Quote + attribution. Social proof.

```html
<figure class="ts-card ts-card--quote">
  <svg class="ts-card__mark">"</svg>
  <blockquote class="ts-card__quote">
    The only project management tool that feels like a Risograph print.
    Fast, colorful, and completely unforgettable.
  </blockquote>
  <figcaption class="ts-card__attribution">
    <img src="…" alt="" class="ts-card__avatar-sm">
    <div>
      <p class="ts-card__name">Alex Carter</p>
      <p class="ts-card__role">VP Engineering, Acme</p>
    </div>
  </figcaption>
</figure>
```

```css
.ts-card--quote {
  padding: var(--ts-sp-8);
  gap: var(--ts-sp-6);
  grid-template-rows: auto 1fr auto;
}
.ts-card--quote .ts-card__mark {
  width: 32px; height: 32px;
  color: var(--ts-accent);
  opacity: 0.35;
}
.ts-card--quote .ts-card__quote {
  font-family: var(--ts-font-display);
  font-size: var(--ts-fs-h4);
  line-height: var(--ts-lh-snug);
  letter-spacing: var(--ts-tracking-snug);
  margin: 0;
  text-wrap: balance;
  max-width: 50ch;
}
.ts-card--quote .ts-card__attribution {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: var(--ts-sp-3);
  align-items: center;
}
.ts-card--quote .ts-card__avatar-sm {
  width: 40px; height: 40px;
  border-radius: var(--ts-radius-full);
  object-fit: cover;
}
.ts-card--quote .ts-card__name { font-weight: 600; }
.ts-card--quote .ts-card__role { font-size: var(--ts-fs-caption); color: var(--ts-text-secondary); }
```

**Pitfalls:**
- ❌ Italic quote → Toolskin doesn't use italic body. Use the display font upright.
- ❌ Massive quotation marks above the text → looks like a meme. Subtle accent mark only.

---

## Recipe 7 · The Action Card (`.ts-card--action`)

Title + summary + ONE primary CTA. The "Get started" card.

```html
<article class="ts-card ts-card--action">
  <div>
    <h3 class="ts-card__title">Ready to ship faster?</h3>
    <p class="ts-card__body">Set up your first project in under 60 seconds. No credit card required.</p>
  </div>
  <a class="ts-btn ts-btn--primary" href="#">Start free →</a>
</article>
```

```css
.ts-card--action {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: var(--ts-sp-8);
  padding: var(--ts-sp-8);
  background: var(--ts-bg-1);
  border-radius: var(--ts-radius-lg);
}
@container card (max-width: 560px) {
  .ts-card--action { grid-template-columns: 1fr; }
}
```

**Pitfalls:**
- ❌ Two CTAs side-by-side → user must choose. One card = one action.
- ❌ Stack on mobile → set `container-type: inline-size` on parent and use container query.

---

## Recipe 8 · The List Card (`.ts-card--list`)

A card whose body IS a list (e.g. recent activity, notifications).

```html
<article class="ts-card ts-card--list">
  <header class="ts-card__header">
    <h3 class="ts-card__title">Recent deployments</h3>
    <a class="ts-card__link" href="#">View all</a>
  </header>
  <ul class="ts-card__list">
    <li class="ts-card__row">
      <span class="ts-badge ts-badge--success">Ready</span>
      <span>Update landing page hero</span>
      <span class="ts-card__meta">2m ago</span>
    </li>
    <li class="ts-card__row">…</li>
  </ul>
</article>
```

```css
.ts-card--list { padding: 0; }
.ts-card--list .ts-card__header {
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--ts-sp-5) var(--ts-sp-6);
  border-bottom: 1px solid var(--ts-border-0);
}
.ts-card--list .ts-card__list {
  list-style: none; padding: 0; margin: 0;
}
.ts-card--list .ts-card__row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: var(--ts-sp-3);
  align-items: center;
  padding: var(--ts-sp-3) var(--ts-sp-6);
}
.ts-card--list .ts-card__row + .ts-card__row {
  border-top: 1px solid var(--ts-border-0);
}
```

**Pitfalls:**
- ❌ Padding on `.ts-card` + padding on rows → double padding. Set card padding to 0
  and let rows own the gutter.
- ❌ `gap` on the list instead of borders → looks like a card stack, not a list.

---

## Recipe 9 · The Spotlight Card (`.ts-card--spotlight`)

Featured / hero card. Asymmetric layout, image-heavy, used as the lead of a grid.

```html
<article class="ts-card ts-card--spotlight">
  <figure class="ts-card__media"><img src="…" alt=""></figure>
  <div class="ts-card__content">
    <p class="ts-card__eyebrow">Editorial</p>
    <h2 class="ts-card__title">When you remove everything that isn't essential, what remains must be perfect.</h2>
    <p class="ts-card__body">A study in restraint, by the editor in chief.</p>
    <a class="ts-btn ts-btn--ghost" href="#">Read full story</a>
  </div>
</article>
```

```css
.ts-card--spotlight {
  padding: 0;
  display: grid;
  grid-template-columns: 5fr 7fr;     /* magazine ratio */
  min-height: 480px;
  border-radius: var(--ts-radius-lg);
  overflow: hidden;
}
.ts-card--spotlight .ts-card__media {
  margin: 0;
}
.ts-card--spotlight .ts-card__media img {
  width: 100%; height: 100%; object-fit: cover;
}
.ts-card--spotlight .ts-card__content {
  padding: var(--ts-sp-12);
  display: grid;
  gap: var(--ts-sp-4);
  align-content: end;                  /* content sinks to the bottom */
  background: var(--ts-bg-1);
}
.ts-card--spotlight .ts-card__title {
  font-family: var(--ts-font-display);
  font-size: var(--ts-fs-h2);
  line-height: var(--ts-lh-headline);
  letter-spacing: var(--ts-tracking-tight);
  text-wrap: balance;
}
@media (max-width: 768px) {
  .ts-card--spotlight { grid-template-columns: 1fr; min-height: 0; }
}
```

**Pitfalls:**
- ❌ Center-aligned content → kills the editorial feel. `align-content: end` reads as deliberate.
- ❌ 16:9 image but content side fills 4:3 area → mismatched heights. Set explicit `min-height`.

---

## Recipe 10 · The Glass Card (`.ts-card--glass`)

Translucent over a colorful background. Use sparingly — once per page, max.

```css
.ts-card--glass {
  background: color-mix(in srgb, var(--ts-bg-1), transparent 30%);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid color-mix(in srgb, currentColor, transparent 80%);
}
```

**Pitfalls:**
- ❌ Glass on a flat background → useless. Glass needs imagery/gradient behind it to read.
- ❌ Forgetting `-webkit-` prefix → broken on Safari.

---

## The card matrix (when to use which)

| Need | Recipe |
|---|---|
| Dashboard metric | 1 stat |
| Marketing feature | 2 feature |
| Article tile | 3 media |
| Team / profile | 4 person |
| Plan / tier | 5 price |
| Social proof | 6 quote |
| CTA banner | 7 action |
| Activity feed | 8 list |
| Lead of a grid | 9 spotlight |
| On a hero gradient | 10 glass |

If your need doesn't fit, you're inventing. Re-read the recipes; one will fit.

---

## Composition rules (multi-card layouts)

1. **Same row = same recipe.** Don't mix media + stat in one row.
2. **Same level = same shadow.** Floor cards get shadow-1; only featured gets shadow-2+.
3. **Equal heights = same min-height OR grid `align-items: stretch`.** Don't fight the row.
4. **Hover lift = 2px transform max.** More breaks the grid rhythm.
5. **One featured per row.** Two featured = neither is featured.

---

## The unbreakable test

For any card you build:

- [ ] Title and body align to grid rows, not to content height
- [ ] Footer pinned to bottom regardless of body length
- [ ] Padding consistent with `--ts-sp-*` (no raw px)
- [ ] Hover/focus-visible states defined and visible
- [ ] Works with text 5× longer than design
- [ ] Works with title 1 word vs 8 words (use `text-wrap: balance`)
- [ ] Doesn't overflow at 320px viewport
- [ ] Image (if any) uses `aspect-ratio` + `object-fit: cover`
- [ ] No `position: absolute` for layout (only for badges/marks)
- [ ] Tab order is logical (title → body → CTA)

All ten checked? Card is done.
