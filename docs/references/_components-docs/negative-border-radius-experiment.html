<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/htmlacademy/nebo.css@main/nebo.css">
  <style>
    html {
      color-scheme: dark;

    }

    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&display=swap');

    body {
      color: #e8e9ea;
      font-family: 'Space Grotesk';
      font-weight: bold;
      line-height: 1.3;
      padding: 5%;
      background: #0d0d0d;
      color-scheme: dark;
    }

    /*
  nebo.css settings
  Adjust these 3 parameters to control the inverted corner:
*/

:root{
  --ts-font-display: "Space Grotesk", sans-serif;
   --ts-card-radius: 25px;
  --ts-card-pad: 30px;
  
  --ts-bg-body: #0c0d0f;
  --ts-bg-0: #111214;
  --ts-bg-1: #17181b;
  --ts-text-primary: #e8e9ea;

}
.card {
  --nb-r: var(--ts-card-radius);
  --nb-w: calc(var(--ts-card-pad)*2);
  --nb-h: var(--ts-card-pad);
 
}


/*
  Simple card styles
*/

.card {
  display: flex;
  width: 100%;
  max-width: 450px;
  min-height: 300px;
  padding: var(--ts-card-pad);
 flex-direction: column;
  align-items: center;
justify-content: flex-end;
  color: var(--ts-text-primary);
  background-color: var(--ts-bg-1);
  background-image: url("https://htmlacademy.org/assets/demos/21/img/cat1.jpg");
  background-size: cover;
  background-repeat: no-repeat;
background-attachment: scroll;
  background-position: center;
  border-radius: var(--ts-card-radius);
}


/* 
  Additional helper styles
*/

*, *::before, *::after {
  box-sizing: border-box;
  padding: 0;
  margin: 0;
}

html {
  
  font-family: var(--ts-font-display);
 
  background-color: var(--ts-bg-body);
 
  color: var(--ts-text-primary);
overflow: hidden;
  
}
body{
  overflow-x: hidden;
    margin: 0;
display: flex;
  min-height: 100vh;
  margin: 0;
  padding: var(--ts-card-pad);
 font-size: 20px;
  line-height: 1.2;
 flex-direction: column;
  align-items: center;
justify-content: center;
}

h1 {
  font-size: 1.6rem;
  text-shadow: 1px 1px 0 black;
  font-family: var(--ts-font-display);
font-weight: 700;
}
  </style>

</head>

<body>
  <!--
Using nebo.css:
https://github.com/htmlacademy/nebo.css
https://htmlacademy.org/tutorials/21#23
Add the "nebo" class and the "nebo--tr" modifier 
to create an inverted top-right corner.
-->

<div class="card nebo nebo--tr">
  <h1>Inverted border-radius with a single line of CSS</h1>
</div>

<!-- Full interactive tutorial:
https://htmlacademy.org/tutorials/21#1 -->


</body>

</html>
