<!DOCTYPE html>

<html lang="en" >
<head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <script>
    (function () {
      try {
        var key = 'ts-theme-mode';
        var m = localStorage.getItem(key);
        if (!m) return;
        if (m === 'auto') {
          m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (m === 'dark' || m === 'light') {
          document.documentElement.setAttribute('data-theme', m);
          document.documentElement.setAttribute('data-ts-theme', m);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolskin · Wireframe Drafter</title>

  <!-- Google Fonts — render-blocking (critical for preloader + body text, prevents FOUT) -->
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
  <!-- CDN preconnects — reduces latency for render-blocking theme-toggles CSS + dynamic asset loader -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net/" crossorigin="">
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com/">
  <link rel="dns-prefetch" href="https://api.cdnjs.com/">
  <!-- Other CDN assets (FA, Ionicons, Lenis, GSAP, etc.) loaded dynamically by toolskin-assets.js -->
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </noscript>
  <link rel="icon" href="https://satsea.io/toolskin-showcase/assets/img/favicon.ico" sizes="any">
  <link rel="icon" href="https://satsea.io/toolskin-showcase/assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="https://satsea.io/toolskin-showcase/assets/img/apple-touch-icon.png">

  <!-- ToolskinAssets — dynamic asset pipeline (must load before toolskin.js early boot) -->
  <script src="https://satsea.io/toolskin-showcase/assets/js/toolskin-assets.js" defer=""></script>
  <!-- Preloader critical CSS — inline so the lock is available at first paint,
       before the external stylesheet finishes loading. Mirrors generator/index.html
       <style id="ts-preloader-boot"> pattern. -->
  <style id="ts-preloader-boot">
    html.ts-preloader-lock body {
      background-color: #0c0d0f !important;
    }

    html.ts-preloader-lock,
    html.ts-preloader-lock body {
      overflow: hidden !important;
    }

    html.ts-preloader-lock #ts-app,
    html.ts-preloader-lock #ts-main {
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* Ensure preloader overlay paints before external CSS resolves.
          Fallback background mirrors --ts-bg-body dark default. */
    html.ts-preloader-lock .ts-preloader {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      background-color: #0c0d0f !important;
    }

    /* Hide sidebar during preloader (it's outside #ts-main) */
    html.ts-preloader-lock .ts-oce-panel.ts-oce--open,
    html.ts-preloader-lock .ts-oce-panel.ts-oce--open .ts-oce-fab {
      opacity: 0 !important;
      z-index: -20 !important;

      pointer-events: none !important;
    }
  </style>


  <link rel="stylesheet" href="https://satsea.io/toolskin-showcase/assets/css/toolskin.css">


  <!-- Toolskin Framework — early boot IIFE kicks off ToolskinAssets.loadAll() -->

  <script src="https://satsea.io/toolskin-showcase/assets/js/toolskin.js" defer=""></script>
  <script src="https://satsea.io/toolskin-showcase/assets/js/toolskin-uikit.js" defer=""></script>


  <script>
    window.addEventListener('ts:ready', () => {
      console.log('✅ Toolskin Framework Initialized');
      console.log('Config:', Toolskin.config);
    });




  </script>

  <style>
    :root,
    :root * {
      --ts-stroke: var(--ts-text-primary);
      --ts-surface-front: var(--ts-text-muted);
      --ts-bg-surface-back: var(--ts-bg-body);

      --ts-grid-line-color: color-mix(in srgb, var(--ts-this-bg-border), var(--ts-text-primary-dim) var(--ts-grid-line-mix));
      --ts-grid-line-mix: 10%;
      --ts-grid-bg-pattern: linear-gradient(to right, var(--ts-grid-line-color) 1px, transparent 1px), linear-gradient(to bottom, var(--ts-grid-line-color) 1px, transparent 1px);
      --ts-grid-s: 3dvw 3dvw;


      --ts-grid-pad-1: 20px;
      --ts-grid-pad-2: calc(var(--ts-grid-pad-1)*2);
      --ts-grid-gap-1: 6px;
      --ts-grid-gap-2: calc(var(--ts-grid-pad-1)*1.8);
      --ts-wire-side-w: 260px;

    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: monospace;
      background-color: var(--ts-this-bg);
      background-image: var(--ts-grid-bg-pattern);
      background-size: var(--ts-grid-s);
      --ts-this-bg: var(--ts-bg-surface-back);
      --ts-grid-s: 3dvw 3dvw;
      height: 100vh;
      display: grid;
    }

    /* PAGE FRAME */

    /* RIGHT PANEL */
    .side {
      border-left: 1px dashed var(--ts-stroke);
    }

    /* MAIN FRAME */
    .frame {
      padding: var(--ts-grid-pad-2);
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      gap: 30px;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--ts-stroke);
      padding-bottom: var(--ts-grid-gap-1);
    }

    .logo {
      border: 1px solid var(--ts-stroke);
      padding: var(--ts-grid-gap-1) var(--ts-grid-gap-2);
    }

    .step {
      border: 1px solid var(--ts-stroke);
      padding: var(--ts-grid-gap-1) var(--ts-grid-gap-2);
    }

    /* CONTENT */
    .content {
      max-width: 700px;
    }

    .eyebrow {
      border: 1px dashed var(--ts-surface-front);
      display: inline-block;
      padding: var(--ts-grid-gap-1) var(--ts-grid-sp-2);
      margin-bottom: var(--ts-grid-pad-1);
    }

    .title {
      border: 1px solid var(--ts-stroke);
      padding: var(--ts-grid-pad-1);
      margin: 0 0 var(--ts-grid-pad-1) 0;
      font-size: 32px;
    }

    .description {
      border: 1px solid var(--ts-stroke);
      padding: var(--ts-grid-pad-1);
    }

    /* META */
    .meta {
      display: flex;
      gap: var(--ts-grid-pad-1);
    }

    .meta-block {
      border: 1px solid var(--ts-stroke);
      padding: var(--ts-grid-gap-1);
      width: var(--ts-wire-side-w);
    }

    .meta-label {
      display: block;
      border-bottom: 1px dashed var(--ts-surface-front);
      margin-bottom: var(--ts-grid-gap-1);
    }

    /* FOOTER */
    .footer {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--ts-stroke);
      padding-top: var(--ts-grid-gap-1);
    }

    .control {
      border: 1px solid var(--ts-stroke);
      padding: var(--ts-grid-gap-1) var(--ts-grid-gap-2);
    }

    /* GRID OVERLAY (BLUEPRINT FEEL) */
    .page {
      width: 1400px;
      height: 800px;
      margin: var(--ts-grid-pad-2) auto;
      border: 1px solid var(--ts-stroke);
      position: relative;
      display: grid;
      grid-template-columns: 1fr var(--ts-wire-side-w);
      background-color: var(--ts-this-bg);
      --ts-this-bg: var(--ts-bg-surface-back);


    }

    .page * {
      position: relative;
      z-index: 0;
    }

    .page::before {

      content: "";
        position: absolute;
    inset: 0;
    background: var(--ts-grid-bg-pattern);
    /* background-color: var(--ts-this-bg-border-disabled); */
    pointer-events: none;
    opacity: 1;
    z-index: 0;
    --ts-this-bg: var(--ts-green);
    --ts-grid-line-color: color-mix(in srgb, var(--ts-this-bg), transparent var(--ts-grid-line-mix));
    /* --ts-grid-bg-pattern: linear-gradient(to right, var(--ts-grid-line-color) 2px, transparent 2px), linear-gradient(to bottom, var(--ts-grid-line-color) 2px, transparent 2px); */
    --ts-grid-s: 1dvh;
    background-size: calc(var(--ts-grid-s) + 1dvw) calc(var(--ts-grid-s) + 1dvw);
    --ts-grid-line-mix: 35%;
    background-origin: border-box;
    opacity: 20%;
    --ts-grid-line-w: 1px;
    --ts-grid-bg-pattern: linear-gradient(to right, var(--ts-grid-line-color) var(--ts-grid-line-w), transparent var(--ts-grid-line-w)), linear-gradient(to bottom, var(--ts-grid-line-color) var(--ts-grid-line-w), transparent var(--ts-grid-line-w));
    }



  </style>
</head>

<body>

  <div class="page">

    <main class="frame">

      <!-- HEADER -->
      <div class="header">
        <div class="logo">LOGO / TOOLSKIN</div>
        <div class="step">01 / 11</div>
      </div>

      <!-- CONTENT -->
      <div class="content">
        <div class="eyebrow">BUSINESS BRIEFING · Q2 2026</div>

        <h1 class="title">
          HERO TITLE BLOCK<br>
          (Make money in 30 days)
        </h1>

        <div class="description">
          BODY COPY BLOCK<br>
          2–3 lines max. Descriptive system explanation.
        </div>
      </div>

      <!-- META -->
      <div class="meta">
        <div class="meta-block">
          <span class="meta-label">PREPARED FOR</span>
          Co-founder review
        </div>

        <div class="meta-block">
          <span class="meta-label">DECISION NEEDED</span>
          Continue / Pivot / Shut down
        </div>
      </div>

      <!-- FOOTER -->
      <div class="footer">
        <div class="control">PRESS → TO ADVANCE</div>
        <div class="control">GRID VIEW</div>
        <div class="control">→</div>
      </div>

    </main>

    <!-- SIDE PANEL -->
    <aside class="side"></aside>

  </div>







</body></html>
