<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>UI Blueprint Wireframe</title>

<style>
:root {
  --line: #111;
  --light: #666;
  --bg: #fff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  font-family: monospace;
}

/* PAGE FRAME */
.page {
  width: 1400px;
  height: 800px;
  margin: 40px auto;
  border: 2px solid var(--line);
  position: relative;
  display: grid;
  grid-template-columns: 1fr 260px;
}

/* RIGHT PANEL */
.side {
  border-left: 2px dashed var(--line);
}

/* MAIN FRAME */
.frame {
  padding: 40px;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  gap: 30px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding-bottom: 10px;
}

.logo {
  border: 1px solid var(--line);
  padding: 6px 10px;
}

.step {
  border: 1px solid var(--line);
  padding: 6px 10px;
}

/* CONTENT */
.content {
  max-width: 700px;
}

.eyebrow {
  border: 1px dashed var(--light);
  display: inline-block;
  padding: 4px 8px;
  margin-bottom: 20px;
}

.title {
  border: 2px solid var(--line);
  padding: 20px;
  margin: 0 0 20px 0;
  font-size: 32px;
}

.description {
  border: 1px solid var(--line);
  padding: 15px;
}

/* META */
.meta {
  display: flex;
  gap: 40px;
}

.meta-block {
  border: 1px solid var(--line);
  padding: 10px;
  width: 260px;
}

.meta-label {
  display: block;
  border-bottom: 1px dashed var(--light);
  margin-bottom: 6px;
}

/* FOOTER */
.footer {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}

.control {
  border: 1px solid var(--line);
  padding: 6px 10px;
}

/* GRID OVERLAY (BLUEPRINT FEEL) */
.page::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

/* PRINT OPTIMIZATION */
@media print {
  body {
    margin: 0;
  }

  .page {
    margin: 0;
    width: 100%;
    height: 100vh;
    border: none;
  }
}
</style>
</head>

<body>

<div class="page">

  <main class="frame">

    <!-- HEADER -->
    <div class="header">
      <div class="logo">LOGO / TOOLSKIN</div>
      <div class="step">01 / 11</div>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <div class="eyebrow">BUSINESS BRIEFING · Q2 2026</div>

      <h1 class="title">
        HERO TITLE BLOCK<br>
        (Make money in 30 days)
      </h1>

      <div class="description">
        BODY COPY BLOCK<br>
        2–3 lines max. Descriptive system explanation.
      </div>
    </div>

    <!-- META -->
    <div class="meta">
      <div class="meta-block">
        <span class="meta-label">PREPARED FOR</span>
        Co-founder review
      </div>

      <div class="meta-block">
        <span class="meta-label">DECISION NEEDED</span>
        Continue / Pivot / Shut down
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="control">PRESS → TO ADVANCE</div>
      <div class="control">GRID VIEW</div>
      <div class="control">→</div>
    </div>

  </main>

  <!-- SIDE PANEL -->
  <aside class="side"></aside>

</div>

</body>
</html>
